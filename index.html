// ---- actions -----------------------------------------------------------------
const cmrtBadge = (s) => !s.cmrt_status ? badge('No CMRT', 'red') : s.cmrt_expired ? badge('Expired', 'red') : s.cmrt_status === 'received' ? badge('Awaiting review', 'amber') : s.cmrt_status === 'accepted_with_gaps' ? badge('Accepted with gaps', 'amber') : badge('Current', 'green');
function splitCsv(line) {
  const out = []; let cur = '', q = false;
  for (const ch of line) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur.trim()); cur = ''; } else cur += ch; }
  out.push(cur.trim()); return out;
}

  $('#skuQ').oninput = (e) => { const q = e.target.value.toLowerCase(); document.querySelectorAll('#skuBody tr').forEach((tr) => { tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none'; }); };
  $('#skuCsv').onchange = (e) => importSkus(e.target.files[0]);

async function importSkus(file) {
  if (!file) return;
  const { data: sup, error } = await sb.from('parties').select('id,name').contains('roles', ['supplier']);
  if (error) return toast(error.message);
  const map = new Map(sup.map((s) => [s.name.trim().toLowerCase(), s.id]));
  const lines = (await file.text()).split(/\r?\n/).filter((l) => l.trim());
  const head = splitCsv(lines[0] || '').map((h) => h.toLowerCase().replace(/[^a-z]/g, ''));
  const ix = (keys) => head.findIndex((h) => keys.includes(h));
  const iS = ix(['sku', 'partnumber', 'item']), iD = ix(['description', 'desc']), iP = ix(['supplier', 'vendor', 'manufacturer']), iN = ix(['supplierpartnumber', 'supplierpn', 'mpn']);
  if (iS < 0 || iP < 0) return toast('The CSV needs "sku" and "supplier" columns.');
  const rows = [], bad = new Set();
  for (const l of lines.slice(1)) {
    const c = splitCsv(l), sku = (c[iS] || '').trim(); if (!sku) continue;
    const sid = map.get((c[iP] || '').trim().toLowerCase());
    if (!sid) { bad.add(c[iP] || '(blank)'); continue; }
    rows.push({ sku, description: iD >= 0 ? c[iD] || null : null, supplier_id: sid, supplier_part_number: iN >= 0 ? c[iN] || null : null });
  }
  let done = 0;
  for (let i = 0; i < rows.length; i += 100) {
    const r = await sb.from('skus').upsert(rows.slice(i, i + 100), { onConflict: 'sku' });
    if (r.error) return modal(`<p class="text-red-600 text-sm">${esc(r.error.message)}</p><p class="text-sm mt-2">${done} SKUs were saved before the error.</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
    done += Math.min(100, rows.length - i);
  }
  if (bad.size) modal(`<h3 class="text-lg font-semibold">${done} SKUs saved</h3><p class="text-sm text-slate-600 mt-2">These supplier names did not match a supplier exactly, so their rows were skipped. Add the supplier or fix the spelling and import again:</p><ul class="mt-2 text-sm list-disc pl-5">${[...bad].map((b) => `<li>${esc(b)}</li>`).join('')}</ul><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
  else toast(`${done} SKUs saved`);
  renderSkus();
}

const sheetRows = (wb, n) => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' });
const findHeader = (rows, needles) => rows.slice(0, 80).findIndex((r) => needles.every((n) => r.some((c) => String(c).toLowerCase().includes(n))));
function labelVal(rows, labels) {
  for (const r of rows) for (let i = 0; i < r.length; i++) {
    const c = String(r[i]).toLowerCase();
    if (labels.some((l) => c.includes(l))) for (let j = i + 1; j < r.length; j++) if (String(r[j]).trim() !== '') return r[j];

}
const asDate = (v) => typeof v === 'number' ? new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10) : (isNaN(Date.parse(v)) ? null : new Date(v).toISOString().slice(0, 10));
const sha256 = async (buf) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map((x) => x.toString(16).padStart(2, '0')).join('');

    sb.from('documents').select('id,title,issued_on,status,party:parties(name)').eq('doc_type', 'cmrt').in('status', ['received', 'accepted', 'accepted_with_gaps']),

  if (ld.error || docs.error || decl.error) return fail(ld.error || docs.error || decl.error);
  const done = new Set(decl.data.map((d) => d.document_id)), pending = docs.data.filter((d) => !done.has(d.id)), last = ld.data[0];
  shell(`<h2 class="text-xl font-semibold mb-4">Conflict minerals</h2>
  <div class="rounded-xl bg-white border border-slate-200 p-4 mb-6 flex flex-wrap items-center gap-3">

    <label class="rounded-lg px-3 py-1.5 text-sm font-medium bg-slate-900 text-white hover:bg-slate-700 cursor-pointer">${last ? 'Load newer list' : 'Load smelter list'}<input id="rmapFile" type="file" accept=".xlsx,.xls,.csv" class="hidden"></label></div>
  <h3 class="font-semibold mb-2">CMRTs waiting to be read</h3>
  <div class="rounded-xl bg-white border border-slate-200 divide-y divide-slate-100 mb-6">${pending.map((d) => `<div class="p-4 flex items-center gap-3"><div class="flex-1"><div class="font-medium">${esc(d.title)}</div><div class="text-sm text-slate-500">${esc(d.party?.name)} · ${esc(d.status.replace('_', ' '))}</div></div>${btn('Read & check smelters', 'parse', { id: d.id })}</div>`).join('') || '<p class="p-6 text-center text-slate-500">Nothing waiting. Uploaded CMRTs appear here.</p>'}</div>

function parseCsvText(t) {
  t = t.replace(/^﻿/, ''); const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); out.push(row); }
  return out.filter((r) => r.some((c) => String(c).trim() !== ''));
}
let pendingRmap = null;
async function importRmap(file) {
  if (!file) return;
  toast('Reading list…');
  const isCsv = /\.csv$/i.test(file.name); let rows, best = null;
  try {
    if (isCsv) { const all = parseCsvText(await file.text()); const h = findHeader(all, ['metal']); if (h >= 0) best = { rows: all, h }; }
    else { const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }); for (const n of wb.SheetNames) { const r = sheetRows(wb, n), h = findHeader(r, ['metal']); if (h >= 0 && (!best || r.length > best.rows.length)) best = { rows: r, h }; } }
  } catch (e) { return toast('Could not read that file.'); }
  if (!best) return toast('Could not find a header row with a "Metal" column.');
  const hdr = best.rows[best.h].map((x) => String(x).toLowerCase().replace(/^﻿/, '').trim());
  const first = (...tests) => { for (const t of tests) { const i = hdr.findIndex((h) => (t instanceof RegExp ? t.test(h) : h === t)); if (i >= 0) return i; } return -1; };
  const iM = first('metal', /metal/), iI = first('smelter id', 'smelter identification number', /identification|facility id|smelter id|^cid/);
  const iN = first('standard smelter name', 'smelter name', 'facility name', /standard.*name/, /(smelter|facility).*name/, 'smelter reference');
  const iC = first('country', /country/), iS = first(/conformance|conformant|assessment status|rmap status|^status$/);
  if (iI < 0 || iN < 0 || iN === iM) return modal(`<p class="text-sm">Could not tell which columns hold the smelter ID and name. Columns found:</p><p class="text-xs text-slate-500 mt-2">${esc(hdr.filter(Boolean).join(' | '))}</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
  const map = new Map();
  for (const r of best.rows.slice(best.h + 1)) {
    const cid = String(r[iI] ?? '').trim(), name = String(r[iN] ?? '').trim(); if (!cid || !name) continue;
    const metal = iM >= 0 ? String(r[iM] ?? '').trim() : null;
    map.set(cid + '|' + metal, { cid, metal, name, country: iC >= 0 ? String(r[iC] ?? '').trim() || null : null, status: iS >= 0 ? String(r[iS] ?? '').trim() || null : 'Listed (conformance not stated)' });
  }
  rows = [...map.values()]; if (!rows.length) return toast('No smelters found in that file.');
  if (rows.filter((x) => x.name.toLowerCase() === (x.metal || '').toLowerCase()).length > rows.length / 2) return toast('Names look the same as metals, so nothing was saved. Send me the file and I will fix the mapping.');
  pendingRmap = { file, rows, hasStatus: iS >= 0 };
  modal(`<h3 class="text-lg font-semibold">Check before loading</h3>
    <p class="text-sm text-slate-600 mt-1">${rows.length} smelters found. Name comes from "${esc(hdr[iN])}", ID from "${esc(hdr[iI])}"${iS >= 0 ? `, status from "${esc(hdr[iS])}"` : ''}.</p>
    ${iS >= 0 ? '' : '<div class="mt-3 rounded-lg bg-amber-50 border border-amber-200 p-3 text-sm text-amber-800">This file has no conformance status column. Smelters will show as "On RMI list, conformance not stated", so the check confirms a smelter is a known one but not that it is conformant. For a conformance check, load the RMAP Conformant Smelters list.</div>'}
    <div class="mt-3 overflow-x-auto"><table class="w-full text-xs"><thead class="text-left text-slate-500"><tr><th>Metal</th><th>Smelter name</th><th>Country</th><th>ID</th></tr></thead><tbody>${rows.slice(0, 5).map((x) => `<tr class="border-t border-slate-100"><td class="py-1">${esc(x.metal)}</td><td>${esc(x.name)}</td><td>${esc(x.country)}</td><td class="font-mono">${esc(x.cid)}</td></tr>`).join('')}</tbody></table></div>
    <div class="mt-4 flex justify-end gap-2">${btn('Cancel', 'close', {}, 'ghost')}${btn('Load ' + rows.length + ' smelters', 'commitRmap')}</div>`);
}
async function commitRmap() {
  const { file, rows } = pendingRmap || {}; if (!rows) return; closeModal(); toast('Loading…');
  const path = `reference/rmap/${crypto.randomUUID()}/${file.name.replace(/[^A-Za-z0-9._-]+/g, '_')}`;
  const up = await sb.storage.from('compliance-docs').upload(path, file, { upsert: false });
  const ld = await sb.from('reference_list_loads').insert({ list_code: 'RMAP', status: 'loading', file_sha256: await sha256(await file.arrayBuffer()), storage_path: up.error ? null : path, notes: file.name, row_count: rows.length }).select('id').single();
  if (ld.error) return toast(ld.error.message);
  for (let i = 0; i < rows.length; i += 500) {
    const r = await sb.from('rmap_smelters').insert(rows.slice(i, i + 500).map((x) => ({ ...x, load_id: ld.data.id })));
    if (r.error) { await sb.from('reference_list_loads').update({ status: 'failed' }).eq('id', ld.data.id); return toast(r.error.message); }
  }
  await sb.from('reference_list_loads').update({ status: 'complete' }).eq('id', ld.data.id);
  const decl = await sb.from('cmrt_declarations').select('id');
  for (const d of decl.data || []) await sb.rpc('check_declaration_smelters', { p_declaration: d.id });
  pendingRmap = null; toast(`${rows.length} smelters loaded${decl.data?.length ? '; existing declarations re-checked' : ''}`); renderMinerals();
}

async function processCmrt(id) {
  toast('Reading CMRT…');
  const { data: d, error } = await sb.from('documents').select('id,party_id,storage_path,issued_on,reporting_year').eq('id', id).single();
  if (error) return toast(error.message);
  const u = await sb.storage.from('compliance-docs').createSignedUrl(d.storage_path, 120);
  if (u.error) return toast(u.error.message);
  let wb; try { wb = XLSX.read(await (await fetch(u.data.signedUrl)).arrayBuffer(), { type: 'array' }); } catch (e) { return toast('Could not read this file as an Excel CMRT.'); }
  const ds = wb.SheetNames.find((n) => /declaration/i.test(n)), ss = wb.SheetNames.find((n) => /smelter\s*list/i.test(n)) || wb.SheetNames.find((n) => /smelter/i.test(n));
  if (!ss) return toast('No smelter list sheet found in this file.');
  const dr = ds ? sheetRows(wb, ds) : [], sr = sheetRows(wb, ss);
  const shortTxt = (c) => { const t = String(c).replace(/\s+/g, ' ').trim().toLowerCase(); return t.length <= 70 ? t : ''; };
  const h = sr.slice(0, 80).findIndex((r) => r.some((c) => shortTxt(c).startsWith('metal')) && r.some((c) => shortTxt(c).startsWith('smelter')));
  if (h < 0) return toast('Could not find the smelter table header row.');
  const hdr = sr[h].map(shortTxt), idxs = (f) => hdr.map((x, i) => (x && f(x) ? i : -1)).filter((i) => i >= 0);
  const iM = idxs((x) => x.startsWith('metal'))[0] ?? -1;
  const iN = idxs((x) => x.startsWith('smelter name'))[0] ?? -1, iL = idxs((x) => /^smelter look-?up/.test(x))[0] ?? -1;
  const iC = idxs((x) => x.includes('country') && x.startsWith('smelter'))[0] ?? idxs((x) => x.includes('country'))[0] ?? -1;
  const idCols = idxs((x) => x.includes('identification'));
  if (iM < 0 || (iN < 0 && iL < 0) || iN === iM) return modal(`<p class="text-sm">Could not tell which CMRT columns hold the metal and smelter name. Headers found:</p><p class="text-xs text-slate-500 mt-2">${esc(hdr.filter(Boolean).join(' | '))}</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
  const ph = /^(enter|select|please)/i, METALS = ['gold', 'tantalum', 'tin', 'tungsten', 'cobalt', 'mica'], sm = [], seen = new Set();
  for (const r of sr.slice(h + 1)) {
    const metal = String(r[iM] ?? '').toLowerCase().trim(); if (!metal || ph.test(metal)) continue;
    let name = String(iN >= 0 ? r[iN] ?? '' : '').trim(); if (!name || ph.test(name)) name = String(iL >= 0 ? r[iL] ?? '' : '').trim(); if (ph.test(name)) name = '';
    let cid = ''; for (const c of idCols) { const m = String(r[c] ?? '').toUpperCase().match(/CID\d{5,}/); if (m) { cid = m[0]; break; } }
    if (!name && !cid) continue;
    if (cid) { const k = metal + '|' + cid; if (seen.has(k)) continue; seen.add(k); }
    sm.push({ metal: METALS.find((m) => metal.includes(m)) || 'other', smelter_name: name || null, smelter_country: iC >= 0 ? String(r[iC] ?? '').trim() || null : null, smelter_id: cid || null });
  }
  if (sm.length && sm.filter((x) => (x.smelter_name || '').toLowerCase() === x.metal).length > sm.length / 2) return toast('The smelter names look like metals, so nothing was saved. Please send me this CMRT so I can fix the reading.');
  const company = String(labelVal(dr, ['company name'])).trim(), auth = String(labelVal(dr, ['authorizer'])).trim(), adate = asDate(labelVal(dr, ['authorization date', 'effective date']));
  const sc = String(labelVal(dr, ['declaration scope'])).toLowerCase();

  const c = await sb.rpc('check_declaration_smelters', { p_declaration: dc.data.id });
  toast(c.error ? 'Saved, but: ' + c.error.message : `${c.data[0].smelters_checked} smelters checked, ${c.data[0].smelters_flagged} need attention`);
  renderMinerals();
}

    if (!contacts.length) return modal(`<p>Add a contact for <b>${esc(name)}</b> first, so the link is tied to a named person.</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
    modal(`<h3 class="text-lg font-semibold">Upload link for ${esc(name)}</h3>
      <label class="block mt-3 text-sm">Who is it for?<select id="lkC" class="mt-1 w-full rounded-lg border border-slate-300 p-2">${contacts.map((c) => `<option value="${c.id}">${esc(c.name)} (${esc(c.email || 'no email')})</option>`).join('')}</select></label>
      <label class="block mt-3 text-sm">Valid for (days)<input id="lkD" type="number" min="1" max="180" value="30" class="mt-1 w-full rounded-lg border border-slate-300 p-2"></label>
      <div class="mt-4 flex justify-end gap-2">${btn('Cancel', 'close', {}, 'ghost')}${btn('Create link', 'mkLink', { id, name })}</div>`);
  },
  mkLink: async ({ id }) => {
    const { data, error } = await sb.rpc('create_portal_link', { p_kind: 'supplier_upload', p_party: id, p_contact: $('#lkC').value, p_days: +$('#lkD').value });
    if (error) return toast(error.message);
    const url = `${new URL(CFG.portalUrl, location.href).href}?token=${data.token}`;
    modal(`<h3 class="text-lg font-semibold">Link ready</h3>
      <p class="text-sm text-slate-500 mt-1">Copy it now. For security it cannot be shown again. Expires ${fmt(data.expires_at)}.</p>
      <input id="lkU" readonly value="${esc(url)}" class="mt-3 w-full rounded-lg border border-slate-300 p-2 text-xs font-mono">
      <div class="mt-4 flex justify-end gap-2">${btn('Copy', 'copy')}${btn('Done', 'close', {}, 'ghost')}</div>`);
  },
  addSupplier: () => modal(`<h3 class="text-lg font-semibold">Add supplier</h3>
    <label class="block mt-3 text-sm">Company name<input id="sName" class="mt-1 w-full rounded-lg border border-slate-300 p-2"></label>
    <label class="block mt-3 text-sm">Country (2-letter code, e.g. DE)<input id="sCountry" maxlength="2" class="mt-1 w-full rounded-lg border border-slate-300 p-2 uppercase"></label>
    <p id="fErr" class="text-xs text-red-600 mt-2 h-4"></p>
    <div class="mt-3 flex justify-end gap-2">${btn('Cancel', 'close', {}, 'ghost')}${btn('Save', 'saveSupplier')}</div>`),
  saveSupplier: async () => {
    const name = $('#sName').value.trim(), c = $('#sCountry').value.trim().toUpperCase();
    if (!name) return ($('#fErr').textContent = 'Enter the company name.');
    if (c && !/^[A-Z]{2}$/.test(c)) return ($('#fErr').textContent = 'Country must be a 2-letter code, or leave it blank.');
    const { error } = await sb.from('parties').insert({ name, country: c || null, roles: ['supplier'] });
    if (error) return ($('#fErr').textContent = error.message);
    closeModal(); toast('Supplier added'); route();
  },
  addContact: ({ id, name }) => modal(`<h3 class="text-lg font-semibold">Add contact at ${esc(name)}</h3>
    <label class="block mt-3 text-sm">Full name<input id="cName" class="mt-1 w-full rounded-lg border border-slate-300 p-2"></label>
    <label class="block mt-3 text-sm">Email<input id="cEmail" type="email" class="mt-1 w-full rounded-lg border border-slate-300 p-2"></label>
    <label class="block mt-3 text-sm">Job title (optional)<input id="cTitle" class="mt-1 w-full rounded-lg border border-slate-300 p-2"></label>
    <p id="fErr" class="text-xs text-red-600 mt-2 h-4"></p>
    <div class="mt-3 flex justify-end gap-2">${btn('Cancel', 'close', {}, 'ghost')}${btn('Save', 'saveContact', { id })}</div>`),
  saveContact: async ({ id }) => {
    const n = $('#cName').value.trim(), em = $('#cEmail').value.trim();
    if (!n || !em) return ($('#fErr').textContent = 'Name and email are required.');
    const { error } = await sb.from('party_contacts').insert({ party_id: id, name: n, email: em, job_title: $('#cTitle').value.trim() || null });
    if (error) return ($('#fErr').textContent = error.message);
    closeModal(); toast('Contact added');
  },
  reqDocs: async ({ id, name }) => {
    const [c, t] = await Promise.all([
      sb.from('party_contacts').select('id,name,email').eq('party_id', id).eq('is_active', true),
      sb.from('document_types').select('code,name').eq('is_active', true).eq('portal_uploadable', true).order('sort_order')]);
    if (c.error || t.error) return toast((c.error || t.error).message);
    if (!c.data.length) return modal(`<p>Add a contact for <b>${esc(name)}</b> first, so the request goes to a named person.</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
    actions.rq = { contacts: c.data, types: t.data };
    const first = t.data.find((x) => x.code === 'cmrt') || t.data[0];
    const inpc = 'mt-1 w-full rounded-lg border border-slate-300 p-2';
    modal(`<h3 class="text-lg font-semibold">Request documents from ${esc(name)}</h3>
      <label class="block mt-3 text-sm">Send to<select id="rqC" class="${inpc}">${c.data.map((x) => `<option value="${x.id}">${esc(x.name)} (${esc(x.email || 'no email')})</option>`).join('')}</select></label>
      <label class="block mt-3 text-sm">What do we need?<select id="rqType" class="${inpc}">${t.data.map((x) => `<option value="${esc(x.code)}" ${x.code === first?.code ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>
      <label class="block mt-3 text-sm">Subject<input id="rqSub" value="${new Date().getFullYear()} ${esc(first?.name || '')}" class="${inpc}"></label>
      <label class="block mt-3 text-sm">Extra message (optional)<textarea id="rqMsg" rows="3" class="${inpc}"></textarea></label>
      <label class="block mt-3 text-sm">Due in (days)<input id="rqDue" type="number" min="1" max="165" value="30" class="${inpc}"></label>
      <p id="fErr" class="text-xs text-red-600 mt-2 min-h-[1rem]"></p>
      <p class="text-xs text-slate-400">Creating this logs the request as sent and makes a private upload link tied to it.</p>
      <div class="mt-3 flex justify-end gap-2">${btn('Cancel', 'close', {}, 'ghost')}${btn('Create request & link', 'mkReq', { id, name })}</div>`);
  },
  mkReq: async ({ id, name }) => {
    const contact = actions.rq.contacts.find((x) => x.id === $('#rqC').value);
    const subject = $('#rqSub').value.trim(), msg = $('#rqMsg').value.trim(), days = Math.min(165, Math.max(1, +$('#rqDue').value || 30));
    if (!subject) return ($('#fErr').textContent = 'Enter a subject.');
    const due = new Date(Date.now() + days * 864e5).toISOString().slice(0, 10);
    const r = await sb.from('requests').insert({ party_id: id, contact_id: contact.id, doc_type: $('#rqType').value, subject, message: msg || null, status: 'sent', due_on: due }).select('id').single();
    if (r.error) return ($('#fErr').textContent = r.error.message);
    const l = await sb.rpc('create_portal_link', { p_kind: 'supplier_upload', p_party: id, p_contact: contact.id, p_request: r.data.id, p_days: days + 14, p_label: subject });
    if (l.error) return ($('#fErr').textContent = 'The request was logged, but the link failed: ' + l.error.message);
    const url = `${new URL(CFG.portalUrl, location.href).href}?token=${l.data.token}`;
    const first = (contact.name || '').split(' ')[0] || 'there';
    const body = `Hello ${first},\n\nAs part of our supplier compliance program we need the following from ${name}: ${subject}.\n${msg ? '\n' + msg + '\n' : ''}\nPlease use this private link to upload it. No account is needed:\n${url}\n\nPlease send it by ${new Date(due).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}. The link expires on ${new Date(l.data.expires_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}.\n\nThank you,\n${profile?.full_name || ''}`;
    const mailto = `mailto:${encodeURIComponent(contact.email || '')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    modal(`<h3 class="text-lg font-semibold">Request created</h3>
      <p class="text-sm text-slate-500 mt-1">It is logged as sent and due ${fmt(due)}. Copy the link or open a pre-filled email. The link is shown only now.</p>
      <input id="lkU" readonly value="${esc(url)}" class="mt-3 w-full rounded-lg border border-slate-300 p-2 text-xs font-mono">
      <div class="mt-4 flex flex-wrap justify-end gap-2">${btn('Copy link', 'copy', {}, 'ghost')}<a href="${esc(mailto)}" class="rounded-lg px-3 py-1.5 text-sm font-medium bg-slate-900 text-white hover:bg-slate-700">Open email draft</a>${btn('Done', 'close', {}, 'ghost')}</div>`);
    toast('Request logged as sent');
  },
  copy: async () => { await navigator.clipboard.writeText($('#lkU').value); toast('Copied'); }
};
document.addEventListener('click', (e) => { const b = e.target.closest('[data-a]'); if (b && actions[b.dataset.a]) actions[b.dataset.a](b.dataset); });
document.addEventListener('change', (e) => { if (e.target.id === 'rqType') { const s = $('#rqSub'); if (s && !s.dataset.t) s.value = `${new Date().getFullYear()} ${actions.rq.types.find((x) => x.code === e.target.value)?.name || ''}`; } });
document.addEventListener('input', (e) => { if (e.target.id === 'rqSub') e.target.dataset.t = '1'; });

// ---- boot & auth ---------------------------------------------------------------
function route() { ({ today: renderToday, suppliers: renderSuppliers, skus: renderSkus, requests: renderRequests, minerals: renderMinerals, review: renderReview })[view](); }

function loginScreen(msg = '') {
  $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><form id="lf" class="w-full max-w-sm rounded-2xl bg-white border border-slate-200 shadow-sm p-8">
    <h1 class="text-2xl font-semibold tracking-tight">Conformality - Compliance Ledger</h1><p class="text-sm text-slate-500 mt-1">Sign in with your work account.</p>
    <input id="em" type="email" required autocomplete="username" placeholder="Email" class="mt-6 w-full rounded-lg border border-slate-300 p-2.5">
    <input id="pw" type="password" required autocomplete="current-password" placeholder="Password" class="mt-3 w-full rounded-lg border border-slate-300 p-2.5">
    <p class="text-sm text-red-600 mt-2 min-h-[1.25rem]">${esc(msg)}</p>
    <button class="mt-2 w-full rounded-lg bg-slate-900 text-white py-2.5 font-medium hover:bg-slate-700">Sign in</button></form></div>`;
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
    if (error) loginScreen(error.message);
  };
}

async function afterAuth(session) {
  if (!session) return loginScreen();
  user = session.user;
  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error) {
    $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><div class="max-w-md rounded-2xl bg-white border border-red-200 p-8"><h1 class="text-lg font-semibold text-red-700">Could not load your profile</h1><p class="text-sm text-slate-600 mt-2">${esc(error.message)}</p><p class="text-xs text-slate-400 mt-2">Signed in as ${esc(user.email)}</p><div class="mt-4">${btn('Sign out', 'signout', {}, 'ghost')}</div></div></div>`;
    return;
  }
  profile = data;
  if (!profile || !profile.active) {
    $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><div class="max-w-sm text-center"><h1 class="text-xl font-semibold">Waiting for approval</h1><p class="text-slate-500 mt-2">Your account exists but an admin has not activated it yet.</p><div class="mt-4">${btn('Sign out', 'signout', {}, 'ghost')}</div></div></div>`;
    return;
  }
  route();
}

if (!CFG.url || !CFG.key) {
  $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><div class="max-w-md rounded-2xl bg-white border border-slate-200 p-8"><h1 class="text-lg font-semibold">Almost there</h1><p class="text-sm text-slate-600 mt-2">Open this file and paste your Supabase URL and anon key into the <code>CFG</code> block at the top of the script.</p></div></div>`;
} else {
  sb = supabase.createClient(CFG.url, CFG.key, { db: { schema: 'compliance' } });
  sb.auth.onAuthStateChange((_e, session) => setTimeout(() => afterAuth(session), 0));
}
</script>
</body>
</html>
