<style>body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}dialog::backdrop{background:rgba(15,23,42,.5)}#printArea{display:none}
main div:has(>table){overflow-x:auto}
@media(min-width:1024px){
 #topbar{position:sticky;top:0;z-index:20}
 main .overflow-x-auto{max-height:calc(100vh - 12rem);overflow:auto}
 main .overflow-x-auto thead th{position:sticky;top:0;background:#fff;z-index:1;box-shadow:0 1px 0 #e2e8f0}
 main table td,main table th{padding-top:.5rem!important;padding-bottom:.5rem!important}
 #dlg{width:min(92vw,42rem)}
 #dlg [class*="max-h-["]{max-height:calc(100vh - 17rem)!important}
}
@media(min-width:1536px){main{font-size:15px}}
@page{margin:14mm}
@media print{body{background:#fff}#app,#toast,dialog{display:none!important}#printArea{display:block!important;color:#111;font-size:10pt}
#printArea table{width:100%;border-collapse:collapse;font-size:8pt}#printArea th,#printArea td{border-bottom:1px solid #ddd;padding:3px 4px;text-align:left;vertical-align:top}
#printArea thead{display:table-header-group}#printArea tr{page-break-inside:avoid}#printArea h1{font-size:18pt;margin:0}#printArea h2{font-size:12pt;margin:14px 0 4px}.mono{font-family:ui-monospace,monospace}}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<div id="app"></div>
<dialog id="dlg" class="rounded-2xl p-0 w-[min(92vw,34rem)] shadow-2xl"><div id="dlgBody" class="p-6"></div></dialog>
<div id="printArea"></div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 hidden rounded-full bg-slate-900 text-white text-sm px-4 py-2 shadow-lg"></div>

<script>
// ---- VERSION: increase with every revision (also update the user guide's "applies to") ----
// 1.5.0  Layout: High/Medium/Low counters sit in a row above the Dashboard. Conflict Minerals is one page with Document requests and
//         Smelter check as items on it. Icons on menu items and buttons. Sign out, name and role are stacked to save space.
// 1.4.1  Today is now the Dashboard. It has an Urgent section, the High / Medium / Low cards use the same names as the badges, and clicking a card filters the list.
// 1.4.0  New menu: Conflict Minerals, Restricted Party Screening, Trade Compliance, Document review, and a Configuration menu
//         (Suppliers, SKUs, Government data). New Government data page for loading lists and recording reviews.
// 1.3.2  Suppliers: Edit, Deactivate / Reactivate, and Merge (admin) so a duplicate or misnamed supplier can be cleaned up. Needs database part 13.
// 1.3.1  License determination no longer defaults to NLR; the choice is blank unless every item is EAR99.
// 1.3.0  Today: Data currency panel (when outside data and reviews were last updated, with an "I checked this" record),
//        alerts for expiring end user statements. Needs database part 11.
// 1.2.1  App icons: browser favicon, iPhone home-screen, Android and desktop install icons.
// 1.2.0  Responsive layout (phone to wide desktop): the menu scrolls sideways on phones;
//        desktop: full-width pages, sticky top bar and table headers, side-by-side Today and order file, wider dialogs.
// 1.1.0  End user statements (customers sign online or upload), order file checklist, license determination,
//        government-contract flags (FAR Part 12 / TAA / BAA), shipment-check levels (Trade > Rules), order file download.
//        Fixed: date-only values no longer show a day early in US time zones.
// 1.0.0  First versioned release. Added the user guide link.
const APP_VERSION = '1.5.0';
// ---- CONFIG: paste your Supabase project values -------------------------------
const CFG = {
  url: 'https://sjwarllnehssyphoormc.supabase.co',                    // https://xxxx.supabase.co
  key: 'sb_publishable_eGv0iwOKZ1DP6JixaXZnrQ_vI6nax4S',                    // anon public key
  portalUrl: './portal.html'  // where the supplier portal page will live
};
// -------------------------------------------------------------------------------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (d) => d ? new Date(/^\d{4}-\d{2}-\d{2}$/.test(d) ? d + 'T12:00:00' : d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) : '-';
const toast = (m) => { const t=$('#toast'); t.textContent=m; t.classList.remove('hidden'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.add('hidden'),3500); };
let sb, user, profile, view = 'today';

const badge = (text, tone) => `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium ${({red:'bg-red-100 text-red-700',amber:'bg-amber-100 text-amber-800',green:'bg-emerald-100 text-emerald-700',gray:'bg-slate-100 text-slate-600'})[tone]}">${esc(text)}</span>`;
// ---- icons (simple outline set, drawn inline so nothing is downloaded) ---------------------------
const ICON_PATHS = {
  plus: '<path d="M12 5v14M5 12h14"/>', check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  back: '<path d="M19 12H5M12 19l-7-7 7-7"/>', open: '<path d="M7 17 17 7M7 7h10v10"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  printer: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>', ban: '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
  merge: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>', logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  clipcheck: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  filetext: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
  filecheck: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/><path d="m9 15 2 2 4-4"/>',
  tag: '<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r=".5"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  unlock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.7 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.2 1.2 0 0 1 1.5 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/>',
  dashboard: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  gem: '<path d="M6 3h12l4 6-10 13L2 9z"/><path d="M11 3 8 9l4 13 4-13-3-6M2 9h20"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  scroll: '<path d="M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4"/><path d="M19 17V5a2 2 0 0 0-2-2H4M15 8h-5M15 12h-5"/>',
  building: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>',
  package: '<path d="M11 21.7a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7z"/><path d="M12 22V12M3.3 7 12 12l8.7-5"/>',
  landmark: '<path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2l8 5H4z"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
  book: '<path d="M2 4h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>'
};
const ico = (n, c = 'h-4 w-4') => ICON_PATHS[n] ? `<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[n]}</svg>` : '';
const ICON_BY_LABEL = [[/^\+|^(add|new|create)\b/i, 'plus'], [/^(sign out)/i, 'logout'], [/^(cancel|close|skip)\b/i, 'x'], [/^back\b/i, 'back'],
  [/^(save|confirm|approve|accept|done|ok\b|mark verified|resolve|create)/i, 'check'], [/^(edit|rename)/i, 'pencil'],
  [/^(deactivate|remove|reject|block|revoke|retire|send back)/i, 'ban'], [/^reactivate/i, 'refresh'], [/^merge/i, 'merge'],
  [/^(copy)/i, 'copy'], [/^(download|export)/i, 'download'], [/^(print)/i, 'printer'], [/^(upload|attach)/i, 'upload'],
  [/^(screen|read & check)/i, 'search'], [/^(load|recheck|re-read|reread)/i, 'refresh'], [/^(remind|send)/i, 'send'], [/^release/i, 'unlock'],
  [/^(history)/i, 'clock'], [/^(i checked|record)/i, 'clipcheck'], [/^(manage contact|contact)/i, 'user'], [/^eus\b/i, 'filetext'],
  [/^classify/i, 'tag'], [/^request documents/i, 'inbox'], [/^show all/i, 'list'], [/^(view|review|details|open file)/i, 'eye'],
  [/^(open|go )/i, 'open'], [/^apply/i, 'check']];
const iconFor = (label) => { const l = String(label); const m = ICON_BY_LABEL.find(([re]) => re.test(l)); return m ? ico(m[1]) : ''; };
const btn = (label, a, data = {}, tone = 'primary') => { const ic = iconFor(label); return `<button data-a="${a}" ${Object.entries(data).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')} class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium ${({primary:'bg-slate-900 text-white hover:bg-slate-700',ghost:'border border-slate-300 hover:bg-slate-100',danger:'bg-red-600 text-white hover:bg-red-500'})[tone]}">${ic}${esc(ic ? String(label).replace(/^\+\s*/, '') : label)}</button>`; };

// ---- dialogs -----------------------------------------------------------------
function modal(html, wide) { $('#dlgBody').innerHTML = html; $('#dlg').style.width = wide ? 'min(94vw,76rem)' : ''; if (!$('#dlg').open) $('#dlg').showModal(); }
const closeModal = () => $('#dlg').close();
function askNote(title, required) {
  return new Promise((resolve) => {
    modal(`<h3 class="text-lg font-semibold">${esc(title)}</h3>
      <textarea id="note" rows="4" class="mt-3 w-full rounded-lg border border-slate-300 p-3 text-sm" placeholder="${required ? 'A reason is required' : 'Optional note'}"></textarea>
      <p id="noteErr" class="text-xs text-red-600 mt-1 h-4"></p>
      <div class="mt-3 flex justify-end gap-2">${btn('Cancel','mCancel',{},'ghost')}${btn('Confirm','mOk')}</div>`);
    askNote.ok = () => { const v = $('#note').value.trim(); if (required && !v) { $('#noteErr').textContent = 'Please write a reason.'; return; } closeModal(); resolve(v); };
    askNote.cancel = () => { closeModal(); resolve(null); };
  });
}

// ---- shell -------------------------------------------------------------------
const NAV = [
  { id: 'today', label: 'Dashboard', icon: 'dashboard' },
  { id: 'requests', also: ['minerals'], label: 'Conflict Minerals', icon: 'gem' },
  { id: 'screening', label: 'Restricted Party Screening', icon: 'shield' },
  { id: 'trade', label: 'Trade Compliance', icon: 'globe' },
  { id: 'review', label: 'Document review', icon: 'filecheck' },
  { label: 'Configuration', icon: 'sliders', items: [['suppliers', 'Suppliers', 'building'], ['skus', 'SKUs', 'package'], ['govdata', 'Government data', 'landmark']] },
  { id: 'audit', label: 'Audit', icon: 'scroll' }
];
function closeNavMenu() { const m = document.getElementById('navmenu'); if (m) m.remove(); }
function shell(inner) {
  closeNavMenu();
  if (view === 'requests' || view === 'minerals') {
    const pill = (v, l, ic) => `<button data-a="nav" data-v="${v}" class="inline-flex items-center gap-1.5 px-3 py-1 text-sm rounded-md ${view === v ? 'bg-white shadow text-slate-900 font-medium' : 'text-slate-600'}">${ico(ic)}${l}</button>`;
    inner = `<div class="flex flex-wrap items-center gap-3 mb-4"><h1 class="text-xl font-semibold">Conflict Minerals</h1><div class="inline-flex flex-wrap rounded-lg bg-slate-200 p-0.5">${pill('requests', 'Document requests', 'inbox')}${pill('minerals', 'Smelter check', 'search')}</div></div>` + inner;
  }
  const group = (n, gi) => { const on = n.items.some((x) => x[0] === view); return `<button data-a="menu" data-g="${gi}" aria-haspopup="true" class="inline-flex items-center gap-1.5 px-3 py-2 text-sm font-medium rounded-lg whitespace-nowrap shrink-0 ${on ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-200'}">${ico(n.icon)}${n.label} <span class="text-xs opacity-70">&#9662;</span></button>`; };
  const tab = (n) => `<button data-a="nav" data-v="${n.id}" class="inline-flex items-center gap-1.5 px-3 py-2 text-sm font-medium rounded-lg whitespace-nowrap shrink-0 ${view===n.id||(n.also||[]).includes(view)?'bg-slate-900 text-white':'text-slate-600 hover:bg-slate-200'}">${ico(n.icon)}${n.label}</button>`;
  $('#app').innerHTML = `
  <header id="topbar" class="bg-white border-b border-slate-200"><div class="max-w-[1920px] mx-auto px-4 lg:px-8 py-2.5 flex items-center gap-3 flex-wrap">
    <div class="font-semibold tracking-tight mr-4">Conformality <span class="text-xs font-normal text-slate-400">v${APP_VERSION}</span></div>
    <nav class="flex gap-1 order-last w-full overflow-x-auto 2xl:order-none 2xl:w-auto 2xl:overflow-visible">${NAV.map((n, gi) => n.items ? group(n, gi) : tab(n)).join('')}</nav>
    <div class="ml-auto flex items-center gap-3"><a href="./conformality_user_guide.html" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium border border-slate-300 hover:bg-slate-100 text-slate-700">${ico('book')}User guide</a>
      <div class="flex flex-col items-end gap-0.5 leading-tight"><button data-a="signout" class="inline-flex items-center gap-1 rounded-md border border-slate-300 px-2 py-0.5 text-xs font-medium text-slate-700 hover:bg-slate-100">${ico('logout', 'h-3 w-3')}Sign out</button><span class="hidden sm:block max-w-[11rem] truncate text-xs text-slate-500" title="${esc(profile?.full_name || user?.email || '')}">${esc(profile?.full_name || user?.email || '')} · ${esc(profile?.role || '')}</span></div></div>
  </div></header>
  <main class="max-w-[1920px] mx-auto px-4 lg:px-8 py-5 lg:py-6">${inner}</main>`;
}
const loading = () => shell('<p class="text-slate-500">Loading…</p>');
const fail = (e) => shell(`<div class="rounded-xl bg-red-50 border border-red-200 p-4 text-sm text-red-700">${esc(e.message || e)}</div>`);

// ---- views -------------------------------------------------------------------
const ORDER = { high: 0, medium: 1, low: 2 };
const TONE = { high: 'red', medium: 'amber', low: 'gray' };
const ROUTE = { documents: 'review', ownership_submissions: 'review', parties: 'suppliers', requests: 'requests' };

let dashFilter = null;   // null = show everything, or 'high' | 'medium' | 'low'
async function renderToday() {
  loading();
  const [wk, cu] = await Promise.all([sb.from('v_open_work').select('*'), sb.from('v_data_currency').select('*').order('sort_order')]);
  const { data, error } = wk;
  if (error) return fail(error);
  const cur = cu.error ? null : cu.data;   // null = database part 11 not installed yet
  data.sort((a, b) => ORDER[a.severity] - ORDER[b.severity] || (a.due_on || '9').localeCompare(b.due_on || '9'));
  const n = (s) => data.filter((x) => x.severity === s).length;
  const SEV = { high: 'High', medium: 'Medium', low: 'Low' };
  const card = (sev, tone) => { const on = dashFilter === sev; return `<button data-a="dashFilter" data-s="${sev}" aria-pressed="${on}" title="${on ? 'Click to show everything' : 'Show only ' + SEV[sev] + ' items'}" class="text-left rounded-xl bg-white border px-4 py-3 transition ${on ? 'border-slate-900 ring-2 ring-slate-900' : 'border-slate-200 hover:border-slate-400'}"><div class="flex items-baseline justify-between gap-3"><span class="text-sm font-medium text-slate-600">${SEV[sev]}</span><span class="text-3xl font-semibold ${tone}">${n(sev)}</span></div></button>`; };
  const row = (w) => `
      <div class="p-4 flex items-start gap-3">
        <div class="pt-0.5">${badge(SEV[w.severity], TONE[w.severity])}</div>
        <div class="flex-1 min-w-0"><div class="font-medium truncate">${esc(w.title)}</div><div class="text-sm text-slate-500">${esc(w.detail)}${w.due_on ? ' · due ' + fmt(w.due_on) : ''}</div></div>
        ${w.kind === 'eus_expiring' ? btn('Send new link', 'goEus', { id: w.party_id, name: w.title.replace(/^[^:]*: /, '') }) : w.kind === 'data_stale' ? btn('Record check', 'dataCheck', { code: w.ref_id }) : w.ref_table === 'transactions' ? btn('Open', 'goTrade', { t: 'orders', id: w.ref_id }) : (w.ref_table === 'skus' || w.ref_table === 'classifications') ? btn('Open', 'goTrade', { t: 'class' }) : w.kind === 'screening_due' ? btn('Screen now', 'screenNow', { id: w.party_id }) : w.kind === 'lists_stale' ? btn('Load list', 'nav', { v: 'screening' }) : w.ref_table === 'cases' && /^screening match/.test(w.detail) ? btn('Review matches', 'nav', { v: 'screening' }) : w.ref_table === 'cases' ? btn('Resolve', 'resolveCase', { id: w.ref_id }) : ROUTE[w.ref_table] ? btn('Open', 'nav', { v: ROUTE[w.ref_table] }, 'ghost') : ''}
      </div>`;
  const list = (items, empty) => items.length ? `<div class="rounded-xl bg-white border border-slate-200 divide-y divide-slate-100">${items.map(row).join('')}</div>` : `<p class="rounded-xl bg-white border border-slate-200 p-6 text-center text-slate-500">${empty}</p>`;
  const sect = (title, count, tone, body) => `<section class="mb-6"><div class="flex items-center gap-2 mb-2"><h2 class="text-lg font-semibold">${title}</h2>${badge(String(count), tone)}</div>${body}</section>`;

function splitCsv(line) {
  const out = []; let cur = '', q = false;
  for (const ch of line) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur.trim()); cur = ''; } else cur += ch; }
  out.push(cur.trim()); return out;
}

async function importSkus(file) {
  if (!file) return;
  const { data: sup, error } = await sb.from('parties').select('id,name').contains('roles', ['supplier']);
  if (error) return toast(error.message);
  const map = new Map(sup.map((s) => [s.name.trim().toLowerCase(), s.id]));
  const lines = (await file.text()).split(/\r?\n/).filter((l) => l.trim());
  const head = splitCsv(lines[0] || '').map((h) => h.toLowerCase().replace(/[^a-z]/g, ''));
  const ix = (keys) => head.findIndex((h) => keys.includes(h));
  const iS = ix(['sku', 'partnumber', 'item']), iD = ix(['description', 'desc']), iP = ix(['supplier', 'vendor', 'manufacturer']), iN = ix(['supplierpartnumber', 'supplierpn', 'mpn']);
  if (iS < 0 || iP < 0) return toast('The CSV needs "sku" and "supplier" columns.');
  const rows = [], bad = new Set();
  for (const l of lines.slice(1)) {
    const c = splitCsv(l), sku = (c[iS] || '').trim(); if (!sku) continue;
    const sid = map.get((c[iP] || '').trim().toLowerCase());
    if (!sid) { bad.add(c[iP] || '(blank)'); continue; }
    rows.push({ sku, description: iD >= 0 ? c[iD] || null : null, supplier_id: sid, supplier_part_number: iN >= 0 ? c[iN] || null : null });
  }
  let done = 0;
  for (let i = 0; i < rows.length; i += 100) {
    const r = await sb.from('skus').upsert(rows.slice(i, i + 100), { onConflict: 'sku' });
    if (r.error) return modal(`<p class="text-red-600 text-sm">${esc(r.error.message)}</p><p class="text-sm mt-2">${done} SKUs were saved before the error.</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
    done += Math.min(100, rows.length - i);
  }
  if (bad.size) modal(`<h3 class="text-lg font-semibold">${done} SKUs saved</h3><p class="text-sm text-slate-600 mt-2">These supplier names did not match a supplier exactly, so their rows were skipped. Add the supplier or fix the spelling and import again:</p><ul class="mt-2 text-sm list-disc pl-5">${[...bad].map((b) => `<li>${esc(b)}</li>`).join('')}</ul><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
  else toast(`${done} SKUs saved`);
  renderSkus();
}

const CSL_LIST = (s) => {
  s = String(s || '');
  if (/non-?sdn|\bNS-|sectoral|\bSSI\b|\bFSE\b|evader|capta|\bPLC\b|\bCMIC\b|menu-based/i.test(s)) return 'OFAC_NONSDN';
  if (/specially designated|\bSDN\b/i.test(s)) return 'OFAC_SDN';
  if (/military end|\bMEU\b/i.test(s)) return 'BIS_MEU';
  if (/entity list|\bEL\b/i.test(s)) return 'BIS_ENTITY';
  if (/denied persons|\bDPL\b/i.test(s)) return 'BIS_DPL';
  if (/unverified|\bUVL\b/i.test(s)) return 'BIS_UVL';
  if (/debarred|\bDTC\b/i.test(s)) return 'STATE_DEBARRED';
  if (/treasury|ofac/i.test(s)) return 'OFAC_NONSDN';
  return 'OTHER';
};
const isoDate = (v) => { v = String(v || '').trim(); if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10); const t = Date.parse(v); return isNaN(t) ? null : new Date(t).toISOString().slice(0, 10); };
async function importCsl(file) {
  if (!file) return;
  if (!/\.csv$/i.test(file.name)) return toast('Please choose the CSV version of the list.');
  toast('Reading list…');
  let rows; try { rows = parseCsvText(await file.text()); } catch (e) { return toast('Could not read that file.'); }
  const hdr = (rows[0] || []).map((h) => String(h).replace(/^﻿/, '').trim().toLowerCase().replace(/[\s-]+/g, '_'));
  const ix = (k) => hdr.indexOf(k);
  if (ix('source') < 0 || ix('name') < 0) return modal(`<p class="text-sm">This does not look like the Consolidated Screening List CSV. It needs "source" and "name" columns. Columns found:</p><p class="text-xs text-slate-500 mt-2">${esc(hdr.filter(Boolean).join(' | '))}</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
  const g = (r, k) => (ix(k) >= 0 ? String(r[ix(k)] ?? '').trim() : ''), split = (v) => v.split(/\s*;\s*/).map((x) => x.trim()).filter(Boolean);
  const map = new Map();
  for (const r of rows.slice(1)) {
    const name = g(r, 'name'); if (!name) continue;
    const src = g(r, 'source'), list = CSL_LIST(src), addrs = split(g(r, 'addresses')), num = g(r, 'entity_number');
    const base = num || 'n:' + name.toLowerCase() + '|' + (addrs[0] || ''), uid = list === 'OFAC_SDN' ? base : base + '|' + src;
    const countries = [...new Set(addrs.map((a) => (a.split(',').pop() || '').trim()).filter((c) => /^[A-Z]{2}$/.test(c)))];
    const type = g(r, 'type').toLowerCase() || null, lic = g(r, 'license_requirement');
    map.set(list + '|' + uid, { list, uid, name, type, countries, programs: split(g(r, 'programs')), aliases: split(g(r, 'alt_names')), addresses: addrs.slice(0, 10),
      remarks: [g(r, 'title'), g(r, 'remarks'), lic ? 'License requirement: ' + lic : ''].filter(Boolean).join(' · ').slice(0, 1500) || null, listed_on: isoDate(g(r, 'start_date')) });
  }
  const entries = [...map.values()]; if (!entries.length) return toast('No entries found in that file.');
  const counts = {}; for (const e of entries) counts[e.list] = (counts[e.list] || 0) + 1;
  const cur = await sb.rpc('sanctions_summary'); const was = Object.fromEntries((cur.data || []).map((x) => [x.source_list, x.active_entries]));
  pendingCsl = { file, entries, lists: Object.keys(counts) };
  modal(`<h3 class="text-lg font-semibold">Check before loading</h3>
    <p class="text-sm text-slate-600 mt-1">${entries.length.toLocaleString()} entries found in ${esc(file.name)}.</p>
    <table class="w-full text-sm mt-3"><thead class="text-left text-slate-500"><tr><th class="py-1">List</th><th>In this file</th><th>Loaded now</th></tr></thead><tbody>${Object.entries(counts).map(([l, n]) => `<tr class="border-t border-slate-100"><td class="py-1.5">${esc(listName(l))}</td><td>${n.toLocaleString()}</td><td class="text-slate-500">${(was[l] || 0).toLocaleString()}</td></tr>`).join('')}</tbody></table>
    ${counts.OFAC_SDN ? '' : '<div class="mt-3 rounded-lg bg-amber-50 border border-amber-200 p-3 text-sm text-amber-800">This file has no OFAC SDN entries. Make sure you downloaded the full Consolidated Screening List.</div>'}
    <p class="text-xs text-slate-500 mt-3">Loading adds new entries, updates changed ones, and retires entries that are no longer listed (kept for history). All parties are then screened automatically.</p>
    <div class="mt-4 flex justify-end gap-2">${btn('Cancel', 'close', {}, 'ghost')}${btn('Load and screen', 'commitCsl')}</div>`);
}
async function screenAll(runType) {
  const ps = await sb.from('parties').select('id,name').eq('is_active', true).order('name'); if (ps.error) throw ps.error;
  if (!ps.data.length) return { n: 0, open: 0, skipped: [] };
  const lu = await sb.from('reference_list_loads').select('id,list_code').neq('list_code', 'RMAP').eq('status', 'complete').order('loaded_at', { ascending: false });
  const lists = {}; for (const l of lu.data || []) if (!lists[l.list_code]) lists[l.list_code] = l.id;
  const run = await sb.from('screening_runs').insert({ run_type: runType, lists_used: lists }).select('id').single(); if (run.error) throw run.error;
  let i = 0; const skipped = [];
  for (const p of ps.data) {
    setMsg(`Screening ${++i} of ${ps.data.length}: ${p.name}`);
    const r = await sb.rpc('screen_party', { p_party: p.id, p_run: run.data.id });
    if (r.error) { if (/No screening lists/.test(r.error.message)) throw r.error; skipped.push(`${p.name}: ${r.error.message}`); }
  }
  const oh = await sb.from('screening_hits').select('id', { count: 'exact', head: true }).eq('status', 'open');
  await sb.from('screening_runs').update({ finished_at: new Date().toISOString(), parties_screened: ps.data.length - skipped.length, hits_found: oh.count || 0 }).eq('id', run.data.id);
  return { n: ps.data.length - skipped.length, open: oh.count || 0, skipped };
}
async function finishCsl(force) {
  const { loadId, lists, total } = cslCtx;
  const f = await sb.rpc('finish_sanctions_load', { p_load: loadId, p_lists: lists, p_force: !!force });
  if (f.error) {
    if (/would lose/.test(f.error.message)) return modal(`<h3 class="text-lg font-semibold">This file looks incomplete</h3><p class="text-sm mt-2">${esc(f.error.message)}</p><p class="text-sm text-slate-600 mt-2">If you downloaded the full list just now, the list may genuinely have shrunk. Otherwise cancel and download it again.</p><div class="mt-4 flex justify-end gap-2">${btn('Cancel load', 'cancelCsl', {}, 'ghost')}${btn('Retire them anyway', 'forceCsl', {}, 'danger')}</div>`);
    await sb.rpc('fail_sanctions_load', { p_load: loadId, p_reason: f.error.message }); return modal(`<p class="text-sm text-red-700">${esc(f.error.message)}</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
  }
  setMsg('Screening all parties…');
  let res; try { res = await screenAll('list_update'); } catch (e) { cslCtx = null; renderScreening(); return modal(`<h3 class="text-lg font-semibold">List loaded, screening did not run</h3><p class="text-sm mt-2">${esc(e.message)}</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`); }
  cslCtx = null; renderScreening();
  modal(`<h3 class="text-lg font-semibold">Screening list loaded</h3>
    <table class="w-full text-sm mt-3"><thead class="text-left text-slate-500"><tr><th class="py-1">List</th><th>Entries</th><th>Retired</th></tr></thead><tbody>${Object.entries(f.data).map(([l, v]) => `<tr class="border-t border-slate-100"><td class="py-1.5">${esc(listName(l))}</td><td>${v.entries.toLocaleString()}</td><td>${v.retired}</td></tr>`).join('')}</tbody></table>
    <p class="text-sm mt-3">${res.n} part${res.n === 1 ? 'y' : 'ies'} screened. ${res.open ? `<b class="text-amber-700">${res.open} possible match${res.open > 1 ? 'es' : ''} to review.</b>` : 'No matches.'}</p>
    ${res.skipped.length ? `<p class="text-xs text-red-600 mt-2">Not screened: ${esc(res.skipped.join('; '))}</p>` : ''}
    <div class="mt-4 flex justify-end gap-2">${btn('Close', 'close', {}, res.open ? 'ghost' : 'primary')}</div>`);
}
async function commitCsl() {
  const { file, entries, lists } = pendingCsl || {}; if (!entries) return;
  modal(`<h3 class="text-lg font-semibold">Loading screening list</h3><p id="ldMsg" class="text-sm text-slate-600 mt-2">Saving the original file…</p><p class="text-xs text-slate-500 mt-3">Keep this window open until it finishes. This can take a minute or two.</p>`);
  const buf = await file.arrayBuffer(), path = `reference/screening/${crypto.randomUUID()}/${file.name.replace(/[^A-Za-z0-9._-]+/g, '_')}`;
  const up = await sb.storage.from('compliance-docs').upload(path, file, { upsert: false });
  const ld = await sb.from('reference_list_loads').insert({ list_code: 'CSL', status: 'loading', file_sha256: await sha256(buf), storage_path: up.error ? null : path, notes: file.name, row_count: entries.length }).select('id').single();
  if (ld.error) return modal(`<p class="text-sm text-red-700">${esc(ld.error.message)}</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
  cslCtx = { loadId: ld.data.id, lists, total: entries.length };
  try {
    for (let i = 0; i < entries.length; i += 200) {
      setMsg(`Loading entries ${Math.min(i + 200, entries.length).toLocaleString()} of ${entries.length.toLocaleString()}…`);
      const r = await sb.rpc('load_sanctions_batch', { p_load: ld.data.id, p_entries: entries.slice(i, i + 200) }); if (r.error) throw r.error;
    }
  } catch (e) { await sb.rpc('fail_sanctions_load', { p_load: ld.data.id, p_reason: e.message }); cslCtx = null; return modal(`<h3 class="text-lg font-semibold">Load failed</h3><p class="text-sm mt-2 text-red-700">${esc(e.message)}</p><p class="text-xs text-slate-500 mt-2">The previous list is still in use. You can try again.</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`); }
  pendingCsl = null; setMsg('Finishing…'); await finishCsl(false);
}

const controlBadge = (s) => !s.cur_id ? '' : s.jurisdiction === 'ITAR' ? badge('ITAR · USML ' + (s.usml_category || '?'), 'red') : s.jurisdiction === 'EAR' ? badge('EAR · ' + (s.eccn || '?'), s.eccn && s.eccn.toUpperCase() !== 'EAR99' ? 'amber' : 'green') : badge((s.jurisdiction || '') + ' ' + (s.eu_dual_use_no || s.other_control_no || ''), 'gray');
function classState(s) {
  const t = todayIso();
  if (!s.cur_id) return s.draft_id ? { k: 'draft', b: badge('Draft', 'amber') } : { k: 'none', b: badge('Unclassified', 'red') };
  if (s.next_review_on && s.next_review_on < t) return { k: 'review', b: badge('Review overdue', 'red') };
  if (s.next_review_on && s.next_review_on <= new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10)) return { k: 'review', b: badge('Review due', 'amber') };
  return { k: 'ok', b: badge('Approved', 'green') };
}

async function saveClassification({ sku, draft, ap }) {

    if (a.error) { renderTrade(); return modal(`<h3 class="text-lg font-semibold">Saved as a draft</h3><p class="text-sm mt-2 text-red-700">It could not be approved: ${esc(a.error.message)}</p><div class="mt-4 flex justify-end gap-2">${btn('Close', 'close', {}, 'ghost')}${btn('Edit draft', 'classify', { id: sku })}</div>`); }

  closeModal(); renderTrade();
}

async function importClass(file) {
  if (!file) return;
  const all = parseCsvText(await file.text()), head = (all[0] || []).map((h) => String(h).toLowerCase().replace(/[^a-z]/g, '')), ix = (...k) => head.findIndex((h) => k.includes(h));
  const iS = ix('sku', 'partnumber', 'item'), iJ = ix('jurisdiction'), iE = ix('eccn'), iU = ix('usml', 'usmlcategory'), iH = ix('hts', 'htscode', 'hs'), iO = ix('origin', 'coo', 'countryoforigin'), iSr = ix('source'), iR = ix('rationale', 'notes');
  if (iS < 0) return toast('The CSV needs a "sku" column. Optional: jurisdiction, eccn, usml, hts, origin, source, rationale.');
  const sk = await fetchAll((a, b) => sb.from('skus').select('id,sku').range(a, b)), map = new Map(sk.map((s) => [s.sku.toLowerCase(), s.id]));
  const SRC = new Set(['supplier_stated', 'ccats', 'self_classified', 'consultant', 'other']), rows = [], bad = [];
  for (const r of all.slice(1)) {
    const code = String(r[iS] || '').trim(), id = map.get(code.toLowerCase()); if (!code) continue; if (!id) { bad.push(code); continue; }
    const g = (i) => (i >= 0 ? String(r[i] ?? '').trim() || null : null), jur = (g(iJ) || '').toUpperCase(), coo = (g(iO) || '').toUpperCase(), src = (g(iSr) || '').toLowerCase().replace(/\s+/g, '_');
    rows.push({ sku_id: id, status: 'under_review', requested_on: todayIso(), jurisdiction: ['EAR', 'ITAR', 'EU'].includes(jur) ? jur : jur ? 'other' : null, eccn: g(iE), usml_category: g(iU), hts_code: g(iH), country_of_origin: /^[A-Z]{2}$/.test(coo) ? coo : null, source: SRC.has(src) ? src : null, rationale: g(iR) });
  }
  let n = 0; for (let i = 0; i < rows.length; i += 100) { const r = await sb.from('classifications').insert(rows.slice(i, i + 100)); if (r.error) return modal(`<p class="text-sm text-red-700">${esc(r.error.message)}</p><p class="text-sm mt-2">${n} drafts were saved before the error.</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`); n += Math.min(100, rows.length - i); }
  modal(`<h3 class="text-lg font-semibold">${n} draft${n === 1 ? '' : 's'} created</h3><p class="text-sm text-slate-600 mt-2">They are drafts, not approvals. Open each one to add the rationale and approve it.</p>${bad.length ? `<p class="text-xs text-amber-700 mt-2">Skipped, no matching SKU: ${esc([...new Set(bad)].slice(0, 20).join(', '))}</p>` : ''}<div class="mt-4 text-right">${btn('OK', 'close')}</div>`); renderTrade();
}

const AUD_AREA = { documents: 'Document', parties: 'Party', party_contacts: 'Contact', skus: 'SKU', cases: 'Case', case_events: 'Case note', requests: 'Request', request_events: 'Request event', request_campaigns: 'Request campaign', cmrt_declarations: 'CMRT declaration', cmrt_smelters: 'CMRT smelter', reference_list_loads: 'Reference list load', classifications: 'Classification', ownership_links: 'Ownership link', ownership_submissions: 'Ownership submission', portal_links: 'Portal link', portal_events: 'Portal visit', published_reports: 'Customer report', profiles: 'User account', app_settings: 'Setting', document_types: 'Document type', screening_runs: 'Screening run', screenings: 'Screening', screening_hits: 'Screening hit', screening_clearances: 'Screening clearance', transactions: 'Order', transaction_lines: 'Order item', transaction_parties: 'Transaction party', country_rules: 'Country rule', rule_profiles: 'Rule profile' };

async function collectFindings(declId) {
  const [dRes, sm, ref] = await Promise.all([
    sb.from('cmrt_declarations').select('id,party_id,reporting_year,is_complete,completeness_notes,party:parties(name)').eq('id', declId).single(),
    fetchAll((a, b) => sb.from('cmrt_smelters').select('metal,smelter_name,smelter_country,smelter_id,check_status,disposition').eq('declaration_id', declId).order('id').range(a, b)),
    fetchAll((a, b) => sb.from('v_rmap_current').select('cid,metal').order('id').range(a, b))]);
  if (dRes.error) throw dRes.error;
  const key = (m, c) => String(m || '').toLowerCase() + '|' + String(c || '').trim().toUpperCase();
  const refKeys = new Set(ref.map((r) => key(r.metal, r.cid))), declKeys = new Set(sm.filter((x) => x.smelter_id).map((x) => key(x.metal, x.smelter_id)));
  const matched = [...declKeys].filter((k) => refKeys.has(k)).length;
  return { d: dRes.data, issues: sm.filter(isOpenFlag), pct: refKeys.size ? Math.round((100 * matched) / refKeys.size) : 0 };
}
function buildExceptions(f) {
  const cap = (m) => (m ? m[0].toUpperCase() + m.slice(1) : ''), out = [], used = new Set();
  const take = (fn) => f.issues.filter((x, i) => !used.has(i) && fn(x) && (used.add(i), true));
  const ni = take((x) => !x.smelter_id && /not yet identified/i.test(x.smelter_name || ''));
  if (ni.length) out.push(`Unidentified smelters for ${[...new Set(ni.map((x) => cap(x.metal)))].join(', ')}. Identify them and give their RMI smelter IDs, or give a dated plan to do so. If any smelter is still unidentified, the answer to the question on whether all smelters are identified should be No.`);
  const nl = take((x) => !x.smelter_id && /not listed/i.test(x.smelter_name || ''));
  if (nl.length) out.push(`Entries marked "Smelter not listed" with no usable name (${nl.map((x) => cap(x.metal) + (x.smelter_country ? ', ' + x.smelter_country : '')).join('; ')}). Give each smelter's full legal name, country and address.`);
  take((x) => !x.smelter_id).forEach((x) => out.push(`${x.smelter_name || 'Unnamed smelter'} (${cap(x.metal)}) has no smelter ID. Give the RMI smelter ID, or the full name, country and address if it has none.`));
  take((x) => x.check_status === 'not_listed').forEach((x) => out.push(`${x.smelter_name || 'Smelter'} (${cap(x.metal)}, ${x.smelter_id}) is not on the current RMI smelter list. Confirm the ID is correct and whether you still source from this smelter.`));
  take((x) => x.check_status === 'non_conformant').forEach((x) => out.push(`${x.smelter_name || 'Smelter'} (${cap(x.metal)}, ${x.smelter_id}) is not conformant under RMAP. Confirm whether you still use it and your plan to stop or have it audited.`));
  take(() => true).forEach((x) => out.push(`${x.smelter_name || 'Smelter'} (${cap(x.metal)}, ${x.smelter_id || 'no ID'}) has an unrecognised status. Confirm its current status.`));
  if (f.pct >= 80) out.push(`The smelter list covers about ${f.pct}% of the RMI reference list. List only the smelters actually in your supply chain for the products declared.`);
  if (!f.d.is_complete) out.push(`Some declaration fields could not be read (${(f.d.completeness_notes || '').replace(/^Could not find: /, '').replace(/\. Please verify.*$/, '') || 'see the form'}). Make sure all mandatory fields are filled in.`);
  return out;
}
async function requestCorrection(docId, note) {
  const { data: d, error } = await sb.from('documents').select('id,title,party_id,created_at,party:parties(name)').eq('id', docId).single();
  if (error) return toast(error.message);
  const [c, x] = await Promise.all([sb.from('party_contacts').select('id,name,email').eq('party_id', d.party_id).eq('is_active', true), sb.from('cmrt_declarations').select('id').eq('document_id', docId).maybeSingle()]);
  if (c.error) return toast(c.error.message);
  if (!c.data.length) return modal(`<p class="text-sm">The decision was saved. To request a corrected CMRT, add a contact for <b>${esc(d.party?.name)}</b> first, then use Request documents on the Suppliers tab.</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
  let lines = [], year = new Date().getFullYear();
  if (x.data) { try { const f = await collectFindings(x.data.id); lines = buildExceptions(f); year = f.d.reporting_year || year; } catch (e) { toast('Could not list the exceptions: ' + e.message); } }
  const msg = `We reviewed the CMRT you submitted on ${fmt(d.created_at)} and need a corrected version.\n\n${note ? 'Reviewer note: ' + note + '\n\n' : ''}${lines.length ? 'Please resolve the following:\n' + lines.map((l, i) => `${i + 1}. ${l}`).join('\n') + '\n\n' : ''}Please resubmit using the current RMI CMRT template, completed and authorised by your declared authorizer.`;
  const inpc = 'mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm';
  actions.crx = { docId, lines: lines.length, partyId: d.party_id, partyName: d.party?.name, contacts: c.data };
  modal(`<h3 class="text-lg font-semibold">Request a corrected CMRT from ${esc(d.party?.name)}</h3>
    <p class="text-sm text-slate-500 mt-1">${lines.length ? lines.length + ' exceptions were listed from the review.' : 'No smelter exceptions were found, so only your note is included.'} The supplier will see this message on their upload page, so edit it as needed.</p>

    <label class="block mt-3 text-sm">Subject<input id="crS" value="${esc(`Corrected ${year} CMRT needed`)}" class="${inpc}"></label>
    <label class="block mt-3 text-sm">Message and exceptions<textarea id="crM" rows="14" class="${inpc}">${esc(msg)}</textarea></label>
    <p id="fErr" class="text-xs text-red-600 mt-2 min-h-[1rem]"></p>
    <div class="mt-2 flex justify-end gap-2">${btn('Skip', 'close', {}, 'ghost')}${btn('Create request & link', 'mkCorrection')}</div>`, true);
}
async function mkCorrection() {

  modal(`<h3 class="text-lg font-semibold">Request created</h3>

    if (error) return toast(error.message);
    const c = data[0], f = 'mt-1 w-full rounded-lg border border-slate-300 p-2';
    modal(`<h3 class="text-lg font-semibold">${c ? 'Manage contact' : 'Add contact'} at ${esc(name)}</h3>
    <p class="text-xs text-slate-500 mt-1">One contact per company. Requests, upload links and signing links go to this person.</p>
    <label class="block mt-3 text-sm">Full name<input id="cName" value="${esc(c?.name || '')}" class="${f}"></label>
    <label class="block mt-3 text-sm">Email<input id="cEmail" type="email" value="${esc(c?.email || '')}" class="${f}"></label>
    <label class="block mt-3 text-sm">Phone (optional)<input id="cPhone" value="${esc(c?.phone || '')}" class="${f}"></label>
    <label class="block mt-3 text-sm">Job title (optional)<input id="cTitle" value="${esc(c?.job_title || '')}" class="${f}"></label>
    <p id="fErr" class="text-xs text-red-600 mt-2 h-4"></p>
    <div class="mt-3 flex justify-end gap-2">${btn('Cancel', 'close', {}, 'ghost')}${btn('Save', 'saveContact', { id, cid: c?.id || '' })}</div>`);
  },
  saveContact: async ({ id, cid }) => {
    const n = $('#cName').value.trim(), em = $('#cEmail').value.trim();
    if (!n || !em) return ($('#fErr').textContent = 'Name and email are required.');
    const row = { name: n, email: em, phone: $('#cPhone').value.trim() || null, job_title: $('#cTitle').value.trim() || null };
    const { error } = cid ? await sb.from('party_contacts').update(row).eq('id', cid) : await sb.from('party_contacts').insert({ party_id: id, ...row });
    if (error) return ($('#fErr').textContent = error.message);
    closeModal(); toast(cid ? 'Contact updated' : 'Contact added'); route();
  },
  reqDocs: async ({ id, name }) => {
    const [c, t] = await Promise.all([
      sb.from('party_contacts').select('id,name,email').eq('party_id', id).eq('is_active', true),
      sb.from('document_types').select('code,name').eq('is_active', true).eq('portal_uploadable', true).order('sort_order')]);
    if (c.error || t.error) return toast((c.error || t.error).message);
    if (!c.data.length) return modal(`<p>Add a contact for <b>${esc(name)}</b> first, so the request goes to a named person.</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
    actions.rq = { contacts: c.data, types: t.data };
    const first = t.data.find((x) => x.code === 'cmrt') || t.data[0];
    const inpc = 'mt-1 w-full rounded-lg border border-slate-300 p-2';
    modal(`<h3 class="text-lg font-semibold">Request documents from ${esc(name)}</h3>
      <label class="block mt-3 text-sm">Send to<select id="rqC" class="${inpc}">${c.data.map((x) => `<option value="${x.id}">${esc(x.name)} (${esc(x.email || 'no email')})</option>`).join('')}</select></label>
      <label class="block mt-3 text-sm">What do we need?<select id="rqType" class="${inpc}">${t.data.map((x) => `<option value="${esc(x.code)}" ${x.code === first?.code ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>
      <label class="block mt-3 text-sm">Subject<input id="rqSub" value="${new Date().getFullYear()} ${esc(first?.name || '')}" class="${inpc}"></label>
      <label class="block mt-3 text-sm">Extra message (optional)<textarea id="rqMsg" rows="3" class="${inpc}"></textarea></label>
      <label class="block mt-3 text-sm">Due in (days)<input id="rqDue" type="number" min="1" max="165" value="30" class="${inpc}"></label>
      <p id="fErr" class="text-xs text-red-600 mt-2 min-h-[1rem]"></p>
      <p class="text-xs text-slate-400">Creating this logs the request as sent and makes a private upload link tied to it.</p>
      <div class="mt-3 flex justify-end gap-2">${btn('Cancel', 'close', {}, 'ghost')}${btn('Create request & link', 'mkReq', { id, name })}</div>`);
  },
  mkReq: async ({ id, name }) => {
    const contact = actions.rq.contacts.find((x) => x.id === $('#rqC').value);
    const subject = $('#rqSub').value.trim(), msg = $('#rqMsg').value.trim(), days = Math.min(165, Math.max(1, +$('#rqDue').value || 30));
    if (!subject) return ($('#fErr').textContent = 'Enter a subject.');
    const due = new Date(Date.now() + days * 864e5).toISOString().slice(0, 10);
    const r = await sb.from('requests').insert({ party_id: id, contact_id: contact.id, doc_type: $('#rqType').value, subject, message: msg || null, status: 'sent', due_on: due }).select('id').single();
    if (r.error) return ($('#fErr').textContent = r.error.message);
    const l = await sb.rpc('create_portal_link', { p_kind: 'supplier_upload', p_party: id, p_contact: contact.id, p_request: r.data.id, p_days: days + 14, p_label: subject });
    if (l.error) return ($('#fErr').textContent = 'The request was logged, but the link failed: ' + l.error.message);
    const url = `${new URL(CFG.portalUrl, location.href).href}?token=${l.data.token}`;
    const first = (contact.name || '').split(' ')[0] || 'there';
    const body = `Hello ${first},\n\nAs part of our supplier compliance program we need the following from ${name}: ${subject}.\n${msg ? '\n' + msg + '\n' : ''}\nPlease use this private link to upload it. No account is needed:\n${url}\n\nPlease send it by ${new Date(due).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}. The link expires on ${new Date(l.data.expires_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}.\n\nThank you,\n${profile?.full_name || ''}`;
    const mailto = `mailto:${encodeURIComponent(contact.email || '')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    modal(`<h3 class="text-lg font-semibold">Request created</h3>
      <p class="text-sm text-slate-500 mt-1">It is logged as sent and due ${fmt(due)}. Copy the link or open a pre-filled email. The link is shown only now.</p>
      <input id="lkU" readonly value="${esc(url)}" class="mt-3 w-full rounded-lg border border-slate-300 p-2 text-xs font-mono">
      <div class="mt-4 flex flex-wrap justify-end gap-2">${btn('Copy link', 'copy', {}, 'ghost')}<a href="${esc(mailto)}" class="rounded-lg px-3 py-1.5 text-sm font-medium bg-slate-900 text-white hover:bg-slate-700">Open email draft</a>${btn('Done', 'close', {}, 'ghost')}</div>`);
    toast('Request logged as sent');
  },
  eus: ({ id, name, ord }) => eusModal(id, name, ord),
  eusLink: (d) => eusLink(d),
  eusUpload: ({ id, name, ord }) => eusUploadModal(id, name, ord),
  eusSave: (d) => eusSave(d),
  eusView: (d) => eusView(d),
  eusRevoke: async ({ id, name, ord, eid }) => {
    const note = await askNote('Revoke this end user statement? Say why. It stays in the history.', true);
    if (note === null) return eusModal(id, name, ord);
    const r = await sb.rpc('revoke_eus', { p_id: eid, p_reason: note }); if (r.error) toast(r.error.message); else toast('Revoked');
    if (view === 'trade') renderTrade(); eusModal(id, name, ord);
  },
  ofLicense: ({ id }) => licenseModal(id),
  ofLicenseSave: (d) => licenseSave(d),
  ofDetails: ({ id }) => orderDetailsSave(id),
  ofFar12: async ({ id }) => {
    if (!confirm('Confirm that you have checked this purchase order and it is a standard FAR Part 12 (commercial products) order.')) return;
    const r = await sb.from('transactions').update({ far_part12_verified: true }).eq('id', id);
    if (r.error) return toast(r.error.message); toast('Marked as verified'); afterOrderChange(id);
  },
  ofGoClass: () => { closeModal(); tradeTab = 'class'; view = 'trade'; renderTrade(); },
  ofZip: ({ id }) => ofZip(id),
  ofPrint: ({ id }) => ofPrint(id),
  copyText: async ({ src }) => { const el = $(src); await navigator.clipboard.writeText(el.value ?? el.textContent); toast('Copied'); },
  saveEusSettings: async () => {
    const m = Math.round(Number($('#eusMonths').value)), text = $('#eusText').value.trim();
    if (!(m >= 1 && m <= 60)) return ($('#fErr2').textContent = 'Enter a number of months between 1 and 60.'); if (text.length < 40) return ($('#fErr2').textContent = 'The wording looks too short.');
    const r = await sb.from('app_settings').upsert([{ key: 'eus_valid_months', value: m }, { key: 'eus_statement_text', value: text }], { onConflict: 'key' });
    if (r.error) return ($('#fErr2').textContent = r.error.message); toast('Saved'); renderTrade();
  },
  copy: async () => { await navigator.clipboard.writeText($('#lkU').value); toast('Copied'); }
};
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNavMenu(); });
document.addEventListener('click', (e) => { if (!e.target.closest('#navmenu') && !e.target.closest('[data-a="menu"]')) closeNavMenu(); });
document.addEventListener('click', (e) => { const b = e.target.closest('[data-a]'); if (b && actions[b.dataset.a]) actions[b.dataset.a](b.dataset); });
document.addEventListener('change', (e) => { if (e.target.id === 'rqType') { const s = $('#rqSub'); if (s && !s.dataset.t) s.value = `${new Date().getFullYear()} ${actions.rq.types.find((x) => x.code === e.target.value)?.name || ''}`; } });
document.addEventListener('input', (e) => { if (e.target.id === 'rqSub') e.target.dataset.t = '1'; });
document.addEventListener('change', (e) => {
  if (e.target.id === 'ofGov') { const b = $('#ofGovBox'); if (b) b.classList.toggle('hidden', !e.target.checked); }
  if (e.target.dataset && e.target.dataset.rule) sb.from('order_check_rules').update({ level: e.target.value, updated_at: new Date().toISOString() }).eq('item', e.target.dataset.rule).then((r) => toast(r.error ? r.error.message : 'Saved'));
});

// ---- boot & auth ---------------------------------------------------------------
function route() { ({ today: renderToday, suppliers: renderSuppliers, skus: renderSkus, requests: renderRequests, minerals: renderMinerals, screening: renderScreening, trade: renderTrade, review: renderReview, audit: renderAudit, govdata: renderGovData })[view](); }

function loginScreen(msg = '') {
  $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><form id="lf" class="w-full max-w-sm rounded-2xl bg-white border border-slate-200 shadow-sm p-8">
    <h1 class="text-2xl font-semibold tracking-tight">Conformality - Compliance Ledger</h1><p class="text-sm text-slate-500 mt-1">Sign in with your work account.</p>
    <input id="em" type="email" required autocomplete="username" placeholder="Email" class="mt-6 w-full rounded-lg border border-slate-300 p-2.5">
    <input id="pw" type="password" required autocomplete="current-password" placeholder="Password" class="mt-3 w-full rounded-lg border border-slate-300 p-2.5">
    <p class="text-sm text-red-600 mt-2 min-h-[1.25rem]">${esc(msg)}</p>
    <button class="mt-2 w-full rounded-lg bg-slate-900 text-white py-2.5 font-medium hover:bg-slate-700">Sign in</button></form></div>`;
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
    if (error) loginScreen(error.message);
  };
}

async function afterAuth(session) {
  if (!session) return loginScreen();
  user = session.user;
  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error) {
    $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><div class="max-w-md rounded-2xl bg-white border border-red-200 p-8"><h1 class="text-lg font-semibold text-red-700">Could not load your profile</h1><p class="text-sm text-slate-600 mt-2">${esc(error.message)}</p><p class="text-xs text-slate-400 mt-2">Signed in as ${esc(user.email)}</p><div class="mt-4">${btn('Sign out', 'signout', {}, 'ghost')}</div></div></div>`;
    return;
  }
  profile = data;
  if (!profile || !profile.active) {
    $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><div class="max-w-sm text-center"><h1 class="text-xl font-semibold">Waiting for approval</h1><p class="text-slate-500 mt-2">Your account exists but an admin has not activated it yet.</p><div class="mt-4">${btn('Sign out', 'signout', {}, 'ghost')}</div></div></div>`;
    return;
  }
  route();
}

if (!CFG.url || !CFG.key) {
  $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><div class="max-w-md rounded-2xl bg-white border border-slate-200 p-8"><h1 class="text-lg font-semibold">Almost there</h1><p class="text-sm text-slate-600 mt-2">Open this file and paste your Supabase URL and anon key into the <code>CFG</code> block at the top of the script.</p></div></div>`;
} else {
  sb = supabase.createClient(CFG.url, CFG.key, { db: { schema: 'compliance' } });
  sb.auth.onAuthStateChange((_e, session) => setTimeout(() => afterAuth(session), 0));
}
</script>
</body>
</html>
