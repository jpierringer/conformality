<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roadmap">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Portfolio Roadmap</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e3e8ef;--acc:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#eef2f7;--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);--lw:118px}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#141a2e;--ink:#e6e9f2;--mut:#8b95ad;--line:#232b45;--acc:#5b8cff;--chip:#1c2440;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body.noscroll{overflow:hidden}
button{font:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:24px;margin:0;flex:1;letter-spacing:-.02em}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 6px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-left:4px solid var(--c)}
.stat b{font-size:28px;display:block;letter-spacing:-.02em;line-height:1.1}
.stat span{color:var(--mut);font-size:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 8px;gap:8px}
.sec h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;user-select:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.segc{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:8px}
.segc button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:13px;color:var(--mut)}
.segc button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap;flex:none}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap}
.row{display:flex;align-items:center;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.li .grow{flex:1;min-width:0}
.pn{font-weight:650}
.mut{color:var(--mut);font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 6px 20px rgba(37,99,235,.35);z-index:25}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=color]{padding:4px;height:44px}
textarea{min-height:84px;resize:vertical}
.field{margin-bottom:12px}
label.l{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.fh{font-size:12px;font-weight:700;margin:20px 0 10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;background:var(--chip);color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff}
.btn.danger{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.btn.ghost{background:none;color:var(--acc);padding:8px 4px}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.block{width:100%;margin-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* timeline */
.tl{overflow:auto;max-height:64vh;border-radius:14px;background:var(--card);border:1px solid var(--line);position:relative;overscroll-behavior:contain;box-shadow:var(--shadow)}
.tl-in{position:relative}
.tl-head{position:sticky;top:0;z-index:4;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tl-corner{position:sticky;left:0;z-index:5;width:var(--lw);flex:none;background:var(--card);border-right:1px solid var(--line);font-size:10.5px;color:var(--mut);padding:12px 8px}
.tl-years{position:relative;height:40px;flex:none}
.tl-y{position:absolute;top:4px;font-size:12px;font-weight:700}
.tl-q{position:absolute;top:22px;font-size:10px;color:var(--mut)}
.tl-now{position:absolute;top:4px;font-size:10px;font-weight:700;color:#fff;background:var(--acc);border-radius:4px;padding:1px 5px;transform:translateX(-50%);z-index:1}
.tl-row{display:flex;height:44px;border-bottom:1px solid var(--line)}
.tl-lab{position:sticky;left:0;z-index:2;width:var(--lw);flex:none;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:-1px;padding:6px 8px;overflow:hidden}
.tl-lab b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-lab span{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tl-track{position:relative;flex:none}
.tl-grp{display:flex;height:28px;background:var(--chip);border-bottom:1px solid var(--line)}
.tl-glab{position:sticky;left:0;z-index:2;background:var(--chip);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:7px 8px;white-space:nowrap}
.bar{position:absolute;top:15px;height:14px;border-radius:7px}
.mk{position:absolute;top:15px;width:12px;height:12px;transform:translateX(-6px) rotate(45deg);border:2px solid var(--card);border-radius:2px;z-index:1}
.nodates{position:absolute;top:14px;font-size:10px;font-weight:700;line-height:16px;white-space:nowrap;pointer-events:none;filter:brightness(.8)}
.evm{position:absolute;top:6px;width:28px;height:32px;transform:translateX(-14px);z-index:1;cursor:pointer}
.evm::before{content:"";position:absolute;left:7px;top:9px;width:11px;height:11px;transform:rotate(45deg);background:var(--card);border:3px solid var(--c);border-radius:2px;box-shadow:0 0 0 1.5px var(--card)}
.tl-next{position:absolute;top:12px;font-size:11px;font-weight:700;color:var(--acc);white-space:nowrap;background:color-mix(in srgb,var(--acc) 12%,var(--card));padding:2px 6px;border-radius:6px}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);opacity:.55;z-index:1;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--mut);margin:8px 2px}
.legend i{display:inline-block;width:16px;height:8px;border-radius:4px;margin-right:4px;vertical-align:middle}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(2,6,23,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 26px);background:var(--bg);border-radius:18px 18px 0 0;z-index:41;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.sheet.anim{animation:up .26s ease-out}.sheet-bg.anim{animation:fade .2s}
.sheet-h{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet-h h3{flex:1;margin:0;font-size:16.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-h>div{min-width:70px}
.sheet-b{overflow-y:auto;padding:16px 16px calc(36px + env(safe-area-inset-bottom));flex:1;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.hero h2{margin:0 0 2px;font-size:24px;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv span{display:block;font-size:11.5px;color:var(--mut)}
.kv b{font-weight:600;font-size:14px}
.kv small{display:block;font-size:11.5px;color:var(--mut)}
.stepper{display:flex;gap:4px;margin:10px 0 4px}
.stepper i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stepl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut)}
.impact{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.impact:first-child{border-top:0;padding-top:0}
.impact .t{width:92px;flex:none;font-weight:600;font-size:13.5px}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp td,.cmp th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-size:11.5px;color:var(--mut);font-weight:600}
.cmp tr.chg td{background:color-mix(in srgb,var(--warn) 11%,transparent)}
.cmp td:first-child{color:var(--mut);width:28%}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--ok);border-radius:3px}
.ac{display:grid;grid-template-columns:1fr 22px 1fr;gap:6px;align-items:stretch}
.ac .mini{background:var(--chip);border-radius:10px;padding:8px 10px;min-width:0}
.ac .arr{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.empty{text-align:center;color:var(--mut);padding:28px 10px;font-size:14px}
.banner{background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.tag{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--chip);color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .grow{flex:1;min-width:0}
.ev .dt{width:72px;flex:none;font-size:12px;color:var(--mut);text-align:right;padding-top:1px}
.mig{display:flex;align-items:center;gap:8px;margin-top:8px}
.mig select{padding:7px 30px 7px 10px;font-size:14px;width:auto;flex:1}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.center .card{width:100%;max-width:380px}
a{color:var(--acc)}
/* filters, toolbar, zoom */
.fbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fbar input{flex:1;min-width:0}
.ftoggle{flex:none;white-space:nowrap;padding:11px 14px}
.ftoggle.has{background:var(--ink);color:var(--bg)}
.fbody{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px 10px;margin-bottom:12px;box-shadow:var(--shadow)}
.fbody.open{display:block}
.fsum{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);min-height:34px}
.fsec{padding:6px 0 8px;border-top:1px solid var(--line)}
.fsh{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);min-height:28px;margin-bottom:2px}
.fsh .btn{text-transform:none;letter-spacing:0;font-size:12.5px;padding:4px 2px}
.fchip{padding:5px 10px;font-size:12.5px}
.fchip .cnt{font-size:11px;opacity:.55;margin-left:1px}
.fchip.zero{opacity:.42}
.tlbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 8px}
.tlbar .segc{flex:1;min-width:230px;margin:0}
.zoom{display:flex;align-items:center;gap:4px}
.zoom .btn{min-width:38px}
.zl{font-size:12px;min-width:62px;text-align:center}
.tl{touch-action:pan-x pan-y}
.tl-q.qs{color:var(--ink);font-weight:600}
.tl-yl{display:block;font-size:12px;color:var(--ink);margin-top:2px}
.ztip{margin-left:auto;font-style:italic}
.hov{position:fixed;z-index:35;width:320px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(2,6,23,.22);padding:12px 14px;font-size:13px;pointer-events:none;animation:fade .12s}
.hov.touch{pointer-events:auto}
.hov h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.hov .hs{color:var(--mut);font-size:12px;margin:2px 0 8px}
.hov .hl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:10px 0 4px}
.hov .tr{background:var(--chip);border-radius:10px;padding:8px 10px;margin-top:6px}
.hov .tr b{font-size:14px}
.hov .hx{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.hov .hx:first-of-type{border-top:0}
.hov .hx .dt{width:68px;flex:none;color:var(--mut);font-size:12px}
.hov .warn{color:var(--bad);font-weight:600}
.hov .ft{color:var(--mut);font-size:11.5px;margin-top:8px}
.tl{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* compare */
.cmphead{margin:4px 0 10px}
.cmppick{padding:8px 12px 10px}
.cmppick .fsh span{display:flex;gap:4px}
.cmpopts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 2px 10px;font-size:13.5px}
.tg{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.tg input{width:18px;height:18px;-webkit-appearance:auto;appearance:auto;accent-color:var(--acc);margin:0}
.cmpw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);overscroll-behavior:contain}
.ctab{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.ctab th,.ctab td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;max-width:220px}
.ctab thead th{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:2px solid var(--line);min-width:120px}
.ctab tbody th{position:sticky;left:0;z-index:2;background:var(--card);font-weight:600;color:var(--mut);white-space:nowrap;border-right:1px solid var(--line)}
.ctab thead th.corner{left:0;z-index:4;color:var(--mut);font-weight:600;font-size:12px;border-right:1px solid var(--line)}
.ctab .ph{cursor:pointer}.ctab .ph:hover .pn{color:var(--acc)}
.ctab .ph .pn{white-space:nowrap;margin-bottom:4px}
.ctab td.c{text-align:center}
.ctab .cy{color:var(--ok);font-weight:800;font-size:15px}
.ctab .cn{color:var(--line);font-weight:700}
.ctab td.best{font-weight:800;color:var(--ok)}
.ctab .cov{text-align:center;color:var(--mut);font-size:12px;white-space:nowrap;background:color-mix(in srgb,var(--chip) 60%,var(--card))}
.ctab .cov.gp{color:var(--warn);font-weight:600}
.ctab .cov.g0{color:var(--bad);font-weight:800}
.ctab tr.gap th{color:var(--bad)}
.ctab tr.csec td{position:sticky;left:0;background:var(--chip);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);padding:6px 10px}
.vchart{width:100%;height:auto;max-height:340px;margin:10px 0 4px}
.vchart .gl{stroke:var(--line)}.vchart .tk{font-size:10.5px;fill:var(--mut)}.vchart .ax{font-size:11.5px;fill:var(--mut);font-weight:600}
.vchart .vl{stroke:var(--mut);stroke-dasharray:5 5;opacity:.6}
.vchart .pt{cursor:pointer}.vchart .pt circle{stroke:var(--card);stroke-width:2}.vchart .pl{font-size:11.5px;font-weight:700;fill:var(--ink)}
@media (max-width:600px){
  .ctab th,.ctab td{padding:6px 8px;font-size:12.5px}
  .ctab tbody th{white-space:normal;min-width:92px;max-width:108px;font-size:12px}
  .ctab thead th{min-width:104px}
  .ctab thead th.corner{min-width:92px;max-width:108px}
}
/* timeline / list switch + desktop table */
.vbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.vsw{margin:0;min-width:220px}
.vsw button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.vadd{margin-left:auto;display:none}
.lsum{margin:4px 2px 8px;font-size:12.5px}
.ltw{overflow:auto;max-height:calc(100vh - 290px);border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.ltab{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.ltab th{position:sticky;top:0;z-index:2;background:var(--card);text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:10px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.ltab th:hover,.ltab th.on{color:var(--acc)}
.ltab td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ltab tbody tr{cursor:pointer}.ltab tbody tr:hover td{background:color-mix(in srgb,var(--acc) 6%,var(--card))}
.ltab td:first-child{max-width:220px;min-width:170px}
.ltab td.sup{max-width:120px;overflow:hidden;text-overflow:ellipsis}
.ltab th,.ltab td{padding-left:8px;padding-right:8px}.ltab .r{text-align:right}.ltab .nw{white-space:nowrap}
.ltab .cn{color:var(--line);font-weight:700}
.ltab .soon{color:var(--warn);font-weight:700}
.meter{display:inline-block;width:42px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;overflow:hidden;margin-right:4px}
.meter i{display:block;height:100%}
.miss{font-size:11.5px;color:var(--warn);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hwgrid{display:grid;grid-template-columns:1fr;gap:0 12px}
@media (min-width:700px){.hwgrid{grid-template-columns:1fr 1fr}}
/* collapsible filter panel */
.shead,.srail{display:none}
.fpills{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:12.5px}
.fpill{border:1px solid var(--line);background:color-mix(in srgb,var(--acc) 10%,var(--card));color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12.5px}
.fpill:hover{border-color:var(--acc)}
.side:has(.fbody.open)+.mainc .fpills{display:none}
/* desktop & landscape */
@media (min-width:900px), (orientation:landscape) and (min-width:700px){
  body{padding-left:84px}
  nav.tabs{top:0;bottom:0;right:auto;width:84px;flex-direction:column;justify-content:flex-start;gap:2px;padding:calc(env(safe-area-inset-top) + 14px) 0 0;border-top:0;border-right:1px solid var(--line)}
  nav.tabs button{flex:none;padding:11px 0;font-size:11px}
  header.top{padding:calc(env(safe-area-inset-top) + 12px) 24px 12px}
  main{max-width:none;padding:0 24px 32px}
  .fab{bottom:24px;right:28px}
  .toast{bottom:24px}
  .split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start}
  .side{position:sticky;top:62px;max-height:calc(100vh - 74px);overflow-y:auto;padding-bottom:16px;scrollbar-width:thin}
  .ftoggle{display:none}
  .fbody{display:block}
  .shead{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:-2px 0 6px;padding-left:2px}
  .shead .btn{font-size:18px;line-height:1;padding:2px 8px;color:var(--mut)}
  .shead .btn:hover{color:var(--acc)}
  .split{transition:grid-template-columns .2s ease}
  .split:not(.collapsed) .fpills{display:none}
  .split.collapsed{grid-template-columns:48px minmax(0,1fr)}
  .split.collapsed .shead,.split.collapsed .sfull{display:none}
  .split.collapsed .srail{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 0;box-shadow:var(--shadow)}
  .srail button{position:relative;width:38px;height:38px;border:0;border-radius:10px;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:18px}
  .srail button:hover{background:var(--chip);color:var(--acc)}
  .sbadge{position:absolute;top:2px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;line-height:16px}

  .stats{grid-template-columns:repeat(4,1fr);margin-top:0}
  .stat b{font-size:24px}
  .tlbar{margin-top:12px}
  .tl{max-height:calc(100vh - 230px);min-height:320px}
  .tl-lab b{font-size:13px}.tl-lab span{font-size:11.5px}
  .glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;align-items:start}
  .glist>.li,.glist>.card{margin:0}
  .narrow{max-width:900px}
  .vadd{display:inline-block}
  body.wide .fab[data-arg=products]{display:none}
  .cmpw{max-height:calc(100vh - 260px)}
  .sheet{left:auto;right:0;top:0;width:min(620px,100vw);max-width:none;border-radius:0;box-shadow:-10px 0 34px rgba(2,6,23,.18)}
  .sheet.anim{animation:slide .24s ease-out}
}
@media (min-width:700px) and (max-width:1099px) and (orientation:landscape), (min-width:900px) and (max-width:1099px){
  .split{grid-template-columns:232px minmax(0,1fr);gap:14px}
  main{padding:0 16px 24px}
}
@media (orientation:landscape) and (max-height:500px){
  .stats{display:none}
  .tl{max-height:calc(100vh - 120px);min-height:220px}
  .side{top:56px;max-height:calc(100vh - 64px)}
}
@keyframes slide{from{transform:translateX(100%)}}
</style>

<body>

<div id="sheet"></div>
<div id="toast"></div>
<script>
/* =====================================================================
   CONFIG — paste your Supabase project URL and anon (public) key here.
   Leave blank to run in Demo mode (sample data stored on this device),
   or enter them on the "More" tab to connect without editing this file.
   ===================================================================== */
const CONFIG = { SUPABASE_URL: 'https://sjwarllnehssyphoormc.supabase.co', SUPABASE_ANON_KEY: 'sb_publishable_eGv0iwOKZ1DP6JixaXZnrQ_vI6nax4S', SCHEMA: 'roadmap' };

/* ---------- constants ---------- */
const LIFECYCLE=[
 {k:'evaluating',l:'Evaluating',c:'#94a3b8'},{k:'onboarding',l:'Onboarding',c:'#8b5cf6'},
 {k:'active',l:'Active',c:'#16a34a'},{k:'nrnd',l:'NRND',c:'#d97706'},
 {k:'ltb',l:'Last-time buy',c:'#ea580c'},{k:'eol',l:'End of life',c:'#dc2626'},
 {k:'rejected',l:'Not onboarded',c:'#6b7280'}];
const LC=Object.fromEntries(LIFECYCLE.map(x=>[x.k,x]));
const RANK={evaluating:0,onboarding:1,active:2,nrnd:3,ltb:4,eol:5};
const CATEGORIES=[['controller','Controllers'],['telematics','Telematics'],['display','Displays'],['module','I/O & modules'],['sensor','Sensors'],['software','Software'],['other','Other']];
const CATS1={controller:'Controller',telematics:'Telematics',module:'I/O module',sensor:'Sensor',display:'Display',software:'Software',other:'Other'};
const IMPACT={unknown:{l:'Not assessed',c:'#94a3b8'},none:{l:'None',c:'#16a34a'},minor:{l:'Minor',c:'#d97706'},major:{l:'Major',c:'#dc2626'}};
const WEBSTATUS=['Coming Soon','New','Active (no badge)','Previous Gen','End of Life','Not on website'];
const KIND={drop_in:'Drop-in',form_fit:'Form-fit',redesign:'Redesign'};
const MIG=[['not_started','Not started'],['notified','Customer notified'],['evaluating','Evaluating'],['sampling','Sampling'],['validating','Validating'],['released','Released to production'],['complete','Complete'],['at_risk','At risk']];
const MIGC={not_started:'#94a3b8',notified:'#0ea5e9',evaluating:'#8b5cf6',sampling:'#6366f1',validating:'#d97706',released:'#16a34a',complete:'#16a34a',at_risk:'#dc2626'};
const EVK=[['announcement','Supplier announcement'],['pcn','PCN / change notice'],['release','Release'],['nrnd','NRND'],['ltb','Last-time buy'],['eol','End of life'],['milestone','Milestone'],['note','Note']];
const EVC={milestone:'#2563eb',announcement:'#0ea5e9',pcn:'#8b5cf6',release:'#16a34a',nrnd:'#d97706',ltb:'#ea580c',eol:'#dc2626',note:'#64748b'};
const TABLES=['suppliers','markets','products','transitions','customers','customer_products','events','part_numbers'];
const OPTIONAL=['part_numbers']; // added in schema upgrade v2 — app still loads if it hasn't been run
const WIDEQ='(min-width:900px), (orientation:landscape) and (min-width:700px)';
const wide=()=>matchMedia(WIDEQ).matches;
let LW=118;                       // label column width (wider on desktop)
const ZMIN=5,ZMAX=120;            // px per month
const PHG=[['pipeline','Evaluating / onboarding'],['active','Active'],['phasing','Phasing out'],['eol','End of life'],['rejected','Not onboarded']];
const PHG_OF={evaluating:'pipeline',onboarding:'pipeline',active:'active',nrnd:'phasing',ltb:'phasing',eol:'eol',rejected:'rejected'};

/* ---------- state ---------- */
const S={mode:'demo',sb:null,user:null,role:'admin',tab:'roadmap',stack:[],data:{},
  f:{group:'category'},F:{q:'',sup:[],cat:[],ph:[],mkt:[],can:[]},mw:wide()?30:22,fOpen:false,tlScroll:null,rows:[],cmp:{cat:'controller',sel:{},diff:false,gaps:true,metric:'io',priceBy:'list'},rmView:'timeline',lsort:{k:'part',dir:1},incOnly:false};
try{const v=JSON.parse(localStorage.getItem('rm_view')||'null');if(v){Object.assign(S.F,v.F||{});if(v.group)S.f.group=v.group;if(v.mw)S.mw=v.mw;if(v.sideCol)S.sideCol=true;if(v.cmp)Object.assign(S.cmp,v.cmp);if(v.rmView)S.rmView=v.rmView;if(v.lsort)S.lsort=v.lsort;S.incOnly=!!v.incOnly}}catch(e){}
function saveView(){try{localStorage.setItem('rm_view',JSON.stringify({F:S.F,group:S.f.group,mw:S.mw,sideCol:!!S.sideCol,cmp:S.cmp,rmView:S.rmView,lsort:S.lsort,incOnly:S.incOnly}))}catch(e){}}
TABLES.forEach(t=>S.data[t]=[]);

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2)+Date.now();
const byId=(t,id)=>S.data[t].find(x=>x.id===id);
const today=new Date();today.setHours(0,0,0,0);
const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const rel=m=>iso(new Date(today.getFullYear(),today.getMonth()+m,1));
function d(s){if(!s)return null;const[y,m,dd]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,dd)}
const fmt=s=>s?d(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtMY=s=>s?d(s).toLocaleDateString(undefined,{month:'short',year:'numeric'}):'—';  // e.g. "Mar 2027" (never "Mar 27")
const daysUntil=s=>Math.round((d(s)-today)/864e5);
function relTxt(s){if(!s)return'';const n=daysUntil(s),a=Math.abs(n);if(n===0)return'today';const t=a<60?a+' days':Math.round(a/30.4)+' mo';return n>0?'in '+t:t+' ago'}
const tempPw=()=>S.mode==='live'&&!!S.user&&S.user.user_metadata?.pw_set!==true;
const canEdit=()=>S.role==='editor'||S.role==='admin';
const sup=p=>byId('suppliers',p?.supplier_id);
const pnOf=id=>byId('products',id)?.part_number||'?';
function phase(p){
  if(p.lifecycle==='rejected')return'rejected';
  let r=RANK[p.lifecycle]??0;
  if(p.eol_date&&d(p.eol_date)<=today)r=Math.max(r,5);
  else if(p.ltb_date&&d(p.ltb_date)<=today)r=Math.max(r,4);
  else if(p.nrnd_date&&d(p.nrnd_date)<=today)r=Math.max(r,3);
  return Object.keys(RANK).find(k=>RANK[k]===r);
}
const badge=k=>{const x=LC[k]||LC.evaluating;return`<span class="badge" style="--c:${x.c}">${x.l}</span>`};
const impPill=(lab,k)=>{const x=IMPACT[k]||IMPACT.none;return`<span class="pill" style="--c:${x.c}">${lab}: ${x.l}</span>`};
const basisTag=b=>!b?'':/infer|confirm/i.test(b)?`<span class="pill" style="--c:#d97706">⚠ ${esc(b)}</span>`:`<span class="pill" style="--c:#0ea5e9">${esc(b)}</span>`;
const migBadge=k=>`<span class="badge" style="--c:${MIGC[k]||'#94a3b8'}">${esc((MIG.find(m=>m[0]===k)||[,k])[1])}</span>`;
function nextMilestone(p){
  for(const[k,l]of[['nrnd_date','NRND'],['ltb_date','LTB'],['eol_date','EOL']]){if(p[k]&&d(p[k])>=today)return{l,date:p[k]}}
  if(['evaluating','onboarding'].includes(p.lifecycle)){if(p.supplier_release_date&&d(p.supplier_release_date)>=today)return{l:'Release',date:p.supplier_release_date};if(p.onboard_date&&d(p.onboard_date)>=today)return{l:'Onboard',date:p.onboard_date}}
  return null;
}
function needsMig(cp){
  if(['complete'].includes(cp.transition_status))return false;
  const p=byId('products',cp.product_id);if(!p)return false;
  return ['nrnd','ltb','eol'].includes(phase(p))||!!cp.transition_id;
}
function toast(msg){const t=$('#toast');t.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',2600)}
function errMsg(e){let m=e?.message||String(e);if(/schema/i.test(m)&&/must be one of|not exposed|Invalid schema/i.test(m))m+=' — add "roadmap" to Exposed schemas in Supabase API settings.';return m}

/* ---------- data layer (Supabase or local demo) ---------- */
function cfg(){let s={};try{s=JSON.parse(localStorage.getItem('rm_cfg')||'{}')}catch(e){}return{url:CONFIG.SUPABASE_URL||s.url||'',key:CONFIG.SUPABASE_ANON_KEY||s.key||'',hard:!!CONFIG.SUPABASE_URL}}
const Demo={key:'rm_demo_v1',
  load(){let x=null;try{x=JSON.parse(localStorage.getItem(this.key))}catch(e){}if(!x){x=seed();this.save(x)}TABLES.forEach(t=>x[t]=x[t]||[]);return x},
  save(x){try{localStorage.setItem(this.key,JSON.stringify(x))}catch(e){}}};
async function loadAll(){
  if(S.mode==='demo'){S.data=Demo.load();return}
  const res=await Promise.all(TABLES.map(t=>S.sb.from(t).select('*').range(0,9999)));
  res.forEach((r,i)=>{const t=TABLES[i];if(r.error){if(OPTIONAL.includes(t)){S.data[t]=[];return}throw r.error}S.data[t]=r.data||[]});
}
function clean(row){const o={};for(const[k,v]of Object.entries(row)){if(['created_at','updated_at','updated_by'].includes(k)||v===undefined)continue;o[k]=v===''?null:v}return o}
async function save(table,row){
  row=clean(row);
  if(S.mode==='demo'){
    const L=S.data[table],now=new Date().toISOString();
    if(table==='customer_products'&&L.some(x=>x.id!==row.id&&x.customer_id===row.customer_id&&x.product_id===row.product_id))throw new Error('That customer already has this product.');
    if(row.id){const i=L.findIndex(x=>x.id===row.id);L[i]={...L[i],...row,updated_at:now}}
    else{row.id=uid();row.created_at=row.updated_at=now;L.push(row)}
    Demo.save(S.data);return row;
  }
  const id=row.id;delete row.id;
  const q=id?S.sb.from(table).update(row).eq('id',id).select().single():S.sb.from(table).insert(row).select().single();
  const{data,error}=await q;if(error)throw error;
  const L=S.data[table],i=L.findIndex(x=>x.id===data.id);if(i>=0)L[i]=data;else L.push(data);return data;
}
async function remove(table,id){
  if(S.mode==='demo'){
    if(table==='products'&&S.data.customer_products.some(c=>c.product_id===id))throw new Error('Remove this product from its customers first.');
    if(table==='suppliers'&&S.data.products.some(p=>p.supplier_id===id))throw new Error('This supplier still has products.');
    S.data[table]=S.data[table].filter(x=>x.id!==id);
    if(table==='products'){S.data.transitions=S.data.transitions.filter(t=>t.from_product_id!==id&&t.to_product_id!==id);S.data.events=S.data.events.filter(e=>e.product_id!==id);S.data.part_numbers=S.data.part_numbers.filter(x=>x.product_id!==id)}
    if(table==='suppliers')S.data.events=S.data.events.filter(e=>e.supplier_id!==id);
    if(table==='customers')S.data.customer_products=S.data.customer_products.filter(c=>c.customer_id!==id);
    if(table==='transitions')S.data.customer_products.forEach(c=>{if(c.transition_id===id)c.transition_id=null});
    Demo.save(S.data);return;
  }
  const{error}=await S.sb.from(table).delete().eq('id',id);
  if(error){if(error.code==='23503')throw new Error('Still in use elsewhere (e.g. customers or products) — remove those links first.');throw error}
  await loadAll();
}

/* ---------- sample data for demo mode ---------- */

  const P=o=>mk({markets:[],...o});
  const c200=P({supplier_id:stw.id,part_number:'C-200',name:'Mobile controller, 32 I/O (sample)',category:'controller',lifecycle:'nrnd',supplier_release_date:rel(-62),onboard_date:rel(-58),nrnd_date:rel(-4),ltb_date:rel(5),eol_date:rel(14),markets:['Agriculture','Construction','Mining'],software_platform:'CODESYS V3.5 SP16',connector:'2× 48-pin',length_mm:180,width_mm:140,height_mm:42,weight_g:520,mounting:'4× M6',ip_rating:'IP67'});

function fieldHTML(f,v){
  if(f.h)return`<div class="fh">${esc(f.h)}</div>`;
  if(f.row2)return`<div class="hwgrid">${f.row2.map(x=>fieldHTML(x,v)).join('')}</div>`;
  if(f.row)return`<div class="grid3">${f.row.map(x=>fieldHTML(x,v)).join('')}</div>`;
  if(f.t==='hw')return`<div id="hwfields" class="hwgrid">${hwFieldsHTML(v.category,v.hardware)}</div>`;
  const val=v[f.k],req=f.req?'required':'';let inp;
  if(f.t==='select')inp=`<select name="${f.k}" ${req}>${f.req?'':'<option value="">—</option>'}${f.o.map(([a,b])=>`<option value="${esc(a)}" ${String(val??'')===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
  else if(f.t==='multi')inp=`<div class="chips wrap">${f.o.map(([a,b])=>{const on=(val||[]).includes(a);return`<label class="chip ${on?'on':''}"><input type="checkbox" name="${f.k}" value="${esc(a)}" ${on?'checked':''} hidden>${esc(b)}</label>`}).join('')||'<span class="mut">Add markets on the More tab</span>'}</div>`;
  else if(f.t==='textarea')inp=`<textarea name="${f.k}">${esc(val)}</textarea>`;
  else inp=`<input name="${f.k}" type="${f.t||'text'}" value="${esc(val??'')}" ${req} ${f.t==='number'?'step="any" inputmode="decimal"':''}>`;
  return`<div class="field"><label class="l">${esc(f.l)}${f.req?' *':''}</label>${inp}</div>`;
}

let _pnHit=null,_pnQ=null;
function qHit(p){
  const q=S.F.q.trim().toLowerCase();if(!q)return true;
  if(_pnQ!==q){_pnQ=q;_pnHit=new Set(S.data.part_numbers.filter(x=>String(x.part_number).toLowerCase().includes(q)).map(x=>x.product_id))}
  return _pnHit.has(p.id)||[p.part_number,p.name,p.family,p.sub_type,p.product_code,(p.can_protocols||[]).join(' '),(p.interfaces||[]).join(' '),(p.io_types||[]).join(' '),(p.markets||[]).join(' '),p.connector,p.software_platform,sup(p)?.name].join(' ').toLowerCase().includes(q);
}
function passes(p,except){
  if(!qHit(p))return false;
  return FGROUPS.every(g=>g.k===except||!S.F[g.k].length||g.val(p).some(v=>S.F[g.k].includes(v)));
}
const filtered=()=>S.data.products.filter(p=>passes(p));

function timelineInner(products){

}
function tlRow(p,X,W,grid){

// S.cmp = {cat, sel:{[cat]:[ids]}, diff, gaps, metric, priceBy}
function cmpBase(){return S.data.products.filter(p=>p.category===S.cmp.cat).sort((a,b)=>a.part_number.localeCompare(b.part_number))}
function cmpSel(){
  const base=cmpBase();let ids=S.cmp.sel[S.cmp.cat];
  if(!ids){ // default: current + upcoming products, no accessories, max 8
    const pick=base.filter(p=>['evaluating','onboarding','active'].includes(phase(p))&&!/accessor/i.test(p.sub_type||''));
    ids=(pick.length?pick:base).map(p=>p.id).slice(0,8);S.cmp.sel[S.cmp.cat]=ids}
  return base.filter(p=>ids.includes(p.id));
}
const yes='<span class="cy">✓</span>',no='<span class="cn">—</span>';
function cmpRows(cols){
  const fmtD=v=>v?fmtMY(v):'';
  const R=[];const sec=t=>R.push({sec:t});
  const row=(label,get,o={})=>R.push({label,get,...o});
  sec('Overview');
  row('Supplier',p=>sup(p)?.name||'');row('Status',p=>LC[phase(p)]?.l||'',{html:p=>badge(phase(p))});
  row('Family',p=>p.family||'');row('Sub-type',p=>p.sub_type||'');row('Markets',p=>(p.markets||[]).join(', '));
  sec('Hardware');
  [...new Set(cols.flatMap(p=>hwKeys(S.cmp.cat,p.hardware)))].forEach(k=>row(k,p=>(p.hardware||{})[k]||''));
  row('IP rating',p=>p.ip_rating||'');row('Connectors',p=>p.connector||'');
  sec('Pricing');
  row('List price',p=>p.list_price??null,{num:1,best:'min',html:p=>money(p.list_price,p.currency)});
  row('Our cost',p=>p.cost??null,{num:1,best:'min',html:p=>money(p.cost,p.currency)});
  row('Margin',p=>margin(p),{num:1,best:'max',html:p=>margin(p)==null?'':Math.round(margin(p)*100)+'%'});
  row('Price basis',p=>p.price_basis||'');
  sec('I/O');
  row('Inputs',p=>p.inputs??null,{num:1,best:'max'});row('Outputs',p=>p.outputs??null,{num:1,best:'max'});
  row('Total I/O',p=>totalIO(p),{num:1,best:'max'});
  row('CAN ports',p=>p.can_ports??null,{num:1,best:'max'});row('Ethernet ports',p=>p.ethernet_ports??null,{num:1,best:'max'});
  if(['controller','module','telematics'].includes(S.cmp.cat)||cols.some(p=>(p.io_types||[]).length))
    [...new Set([...IOG_ALL,...cols.flatMap(p=>p.io_types||[])])].forEach(x=>row(x,p=>(p.io_types||[]).includes(x),{bool:1}));
  const ifSec=g=>{const opts=g==='Other interfaces'?[...new Set(cols.flatMap(p=>ifIn(p,g)))]:(IFG.find(x=>x[0]===g)||[,[]])[1];
    if(!opts.length)return;sec(g);opts.forEach(x=>row(x,p=>(p.interfaces||[]).includes(x),{bool:1}))};
  ifSec('Wired networking');
  sec('CAN protocols');
  [...new Set([...CANP,...cols.flatMap(p=>p.can_protocols||[])])].forEach(x=>row(x,p=>(p.can_protocols||[]).includes(x),{bool:1}));
  ifSec('Wireless');ifSec('Sensor & video links');ifSec('Other interfaces');
  sec('Software & safety');
  row('Software',p=>p.software_platform||'');row('Functional safety',p=>p.functional_safety||'');
  row('openSYDE',p=>!!p.opensyde_compatible,{bool:1,noGap:1});row('Beacon',p=>!!p.beacon_compatible,{bool:1,noGap:1});
  sec('Lifecycle');
  row('Supplier release',p=>fmtD(p.supplier_release_date));row('NRND',p=>fmtD(p.nrnd_date));row('Last-time buy',p=>fmtD(p.ltb_date));row('End of life',p=>fmtD(p.eol_date));
  row('Successor',p=>S.data.transitions.filter(t=>t.from_product_id===p.id).map(t=>pnOf(t.to_product_id)).join(', '));
  const sk=[...new Set(cols.flatMap(p=>Object.keys(p.specs||{})))].filter(k=>k!=='Notes'&&!HW_RAW.has(k));
  if(sk.length){sec('Datasheet specs');sk.forEach(k=>row(k,p=>(p.specs||{})[k]??''))}
  return R;
}

  </div><div id="cmpres">${compareResults()}</div>`;

function compareResults(){
  const base=cmpBase(),cols=cmpSel(),ids=new Set(cols.map(p=>p.id));
  const picker=`<div class="card cmppick"><div class="fsh">Products to compare <span><button class="btn ghost sm" data-act="cmpall">All</button><button class="btn ghost sm" data-act="cmpnone">None</button></span></div>
    <div class="chips wrap">${base.map(p=>`<button class="chip fchip ${ids.has(p.id)?'on':''}" data-act="cmpsel" data-id="${p.id}"><i class="dot" style="background:${esc(sup(p)?.color||'#999')};width:8px;height:8px"></i>${esc(p.part_number)}${['eol','rejected'].includes(phase(p))?' <span class="cnt">EOL</span>':''}</button>`).join('')}</div></div>`;
  if(cols.length<1)return picker+'<div class="card empty">Pick at least one product to compare.</div>';
  const R=cmpRows(cols);let body='',cur=null,secRows=[];
  const flush=()=>{if(cur&&secRows.length)body+=`<tr class="csec"><td colspan="${cols.length+2}">${esc(cur)}</td></tr>`+secRows.join('');secRows=[]};
  R.forEach(r=>{
    if(r.sec){flush();cur=r.sec;return}
    const vals=cols.map(p=>r.get(p));
    if(r.bool){
      const n=vals.filter(Boolean).length;
      if(n===0&&(r.noGap||!S.cmp.gaps))return;
      if(S.cmp.diff&&(n===cols.length||n===0)&&cols.length>1)return;
      const gap=n===0;
      secRows.push(`<tr class="${gap?'gap':''}"><th>${esc(r.label)}</th>${vals.map(v=>`<td class="c">${v?yes:no}</td>`).join('')}<td class="cov ${gap?'g0':n<cols.length?'gp':''}">${gap?'Gap':`${n}/${cols.length}`}</td></tr>`);
      return;
    }
    const str=vals.map(v=>v==null?'':String(v));
    if(str.every(v=>v===''))return;
    if(S.cmp.diff&&cols.length>1&&str.every(v=>v===str[0]))return;
    let best=null;
    if(r.best){const nums=vals.filter(v=>typeof v==='number');if(nums.length>1){const b=r.best==='max'?Math.max(...nums):Math.min(...nums);if(nums.some(v=>v!==b))best=b}}
    const filled=str.filter(Boolean).length;
    secRows.push(`<tr><th>${esc(r.label)}</th>${cols.map((p,i)=>{const v=vals[i];const h=r.html?r.html(p):(v==null||v===''?'':esc(v));return`<td class="${best!=null&&v===best?'best':''}">${h||'<span class="cn">—</span>'}</td>`}).join('')}<td class="cov ${filled<cols.length?'gp':''}">${filled}/${cols.length}</td></tr>`);
  });
  flush();
  const head=`<tr><th class="corner">${cols.length} of ${base.length}</th>${cols.map(p=>`<th class="ph" data-act="product" data-id="${p.id}"><div class="pn"><i class="dot" style="background:${esc(sup(p)?.color||'#999')};width:7px;height:7px"></i> ${esc(p.part_number)}</div><div>${badge(phase(p))}</div></th>`).join('')}<th class="cov">Coverage</th></tr>`;
  const opts=`<div class="cmpopts">
    <label class="tg"><input type="checkbox" data-change="cmpopt" data-arg="diff" ${S.cmp.diff?'checked':''}> Differences only</label>
    <label class="tg"><input type="checkbox" data-change="cmpopt" data-arg="gaps" ${S.cmp.gaps?'checked':''}> Show gaps <span class="mut">(features none of these have)</span></label></div>`;
  return picker+opts+`<div class="cmpw"><table class="ctab"><thead>${head}</thead><tbody>${body}</tbody></table></div>`+valueChart(cols);
}
/* value vs capability scatter */
function valueChart(cols){
  const M={io:['Total I/O',p=>totalIO(p)],feat:['Interfaces + protocols + I/O types',p=>(p.interfaces||[]).length+(p.can_protocols||[]).length+(p.io_types||[]).length],can:['CAN ports',p=>p.can_ports]};
  const PB={list:['List price',p=>p.list_price],cost:['Our cost',p=>p.cost]};
  const [ml,mf]=M[S.cmp.metric]||M.io,[pl,pf]=PB[S.cmp.priceBy]||PB.list;
  const pts=cols.map(p=>({p,x:pf(p),y:mf(p)})).filter(o=>o.x!=null&&o.x!==''&&o.y!=null);
  const ctl=`<div class="row" style="gap:8px;flex-wrap:wrap"><div class="segc" style="margin:0">${Object.entries(PB).map(([k,[l]])=>`<button class="${(S.cmp.priceBy||'list')===k?'on':''}" data-act="cmpprice" data-arg="${k}">${l}</button>`).join('')}</div>
    <span class="mut">vs</span><div class="segc" style="margin:0">${Object.entries(M).map(([k,[l]])=>`<button class="${(S.cmp.metric||'io')===k?'on':''}" data-act="cmpmetric" data-arg="${k}">${l}</button>`).join('')}</div></div>`;
  const missing=cols.filter(p=>pf(p)==null).length;
  let svg;
  if(pts.length<2){svg=`<div class="empty" style="padding:22px">Add ${pl.toLowerCase()} and ${ml.toLowerCase()} to at least two of these products to see value vs capability.<br><span class="mut">${missing} of ${cols.length} have no ${pl.toLowerCase()} yet — open a product → Edit → Pricing.</span></div>`}
  else{
    const W=640,H=300,L=56,B=40,T=16,Rr=16,xs=pts.map(o=>+o.x),ys=pts.map(o=>+o.y);
    const nice=m=>{const raw=Math.max(m,1)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].find(k=>k*mag>=raw)*mag;return[st,Math.ceil(m*1.05/st)*st||st]};
    const [xs_,x1]=nice(Math.max(...xs)),[ys_,y1]=nice(Math.max(...ys)),x0=0,y0=0;
    const X=v=>L+(v-x0)/(x1-x0)*(W-L-Rr),Y=v=>H-B-(v-y0)/(y1-y0)*(H-B-T);
    const tick=(a,b,st)=>Array.from({length:Math.round((b-a)/st)+1},(_,i)=>a+st*i);
    const cur=pts[0].p.currency;
    let g=tick(x0,x1,xs_).map(v=>`<line x1="${X(v)}" y1="${T}" x2="${X(v)}" y2="${H-B}" class="gl"/><text x="${X(v)}" y="${H-B+16}" text-anchor="middle" class="tk">${money(Math.round(v),cur)}</text>`).join('')
      +tick(y0,y1,ys_).map(v=>`<line x1="${L}" y1="${Y(v)}" x2="${W-Rr}" y2="${Y(v)}" class="gl"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" class="tk">${+v.toFixed(2)}</text>`).join('');
    // value line: capability per unit price, through the origin at the median ratio
    const ratios=pts.map(o=>o.y/o.x).sort((a,b)=>a-b),med=ratios[Math.floor(ratios.length/2)];
    g+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(x1)}" y2="${Y(Math.min(y1,med*x1))}" class="vl"/>`;
    g+=pts.map(o=>`<g data-act="product" data-id="${o.p.id}" class="pt"><circle cx="${X(o.x)}" cy="${Y(o.y)}" r="6" fill="${esc(sup(o.p)?.color||'#2563eb')}"/><text x="${X(o.x)+9}" y="${Y(o.y)-8}" class="pl">${esc(o.p.part_number)}</text></g>`).join('');
    svg=`<svg viewBox="0 0 ${W} ${H}" class="vchart" role="img" aria-label="${esc(ml)} versus ${esc(pl)}">${g}
      <text x="${(L+W-Rr)/2}" y="${H-4}" text-anchor="middle" class="ax">${esc(pl)}</text>
      <text transform="translate(14 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" class="ax">${esc(ml)}</text></svg>
      <div class="mut" style="font-size:12px">Above the dashed line = more ${esc(ml)} per ${cur} than the middle of this group (better value); below = less.${missing?` ${missing} selected product${missing>1?'s have':' has'} no ${pl.toLowerCase()} yet, so ${missing>1?'they are':'it is'} not shown.`:''}</div>`;
  }
  return`<div class="sec"><h2>Value vs capability</h2></div><div class="card">${ctl}${svg}</div>`;
}

   <div class="sec"><h2>Hardware</h2></div>${(()=>{const hw=p.hardware||{},ks=hwKeys(p.category,hw).filter(k=>hw[k]);

   ${(()=>{const has=[p.inputs,p.outputs,p.can_ports,p.ethernet_ports].some(v=>v!=null)||(p.io_types||[]).length,rel=['controller','module','telematics'].includes(p.category);
      if(!has&&!rel)return'';
      return`<div class="sec"><h2>I/O</h2></div><div class="card kv">${kvItem('Inputs / outputs',`${p.inputs??'—'} in · ${p.outputs??'—'} out`,totalIO(p)!=null?`${totalIO(p)} total I/O`:'')+kvItem('CAN / Ethernet ports',`${p.can_ports??'—'} CAN · ${p.ethernet_ports??'—'} Eth`)}${chipsKV('Input types',ioIn(p,'Input types'))}${chipsKV('Output types',ioIn(p,'Output types'))}</div>`})()}
   <div class="sec"><h2>Connectivity</h2></div><div class="card kv">${(()=>{const gs=IF_GROUPS().map(g=>[g,ifIn(p,g)]);

   <div class="sec"><h2>Software &amp; safety</h2></div><div class="card kv">
    ${kvItem('Software',esc(p.software_platform))}${kvItem('Functional safety',esc(p.functional_safety))}

   <button class="btn sm" data-act="cmpgo" data-id="${p.id}" style="margin-top:12px">⇆ Compare with other ${esc((CATEGORIES.find(c=>c[0]===p.category)||[,'products'])[1].toLowerCase())}</button>

   ${out.length?out.map(trCard).join(''):`<div class="card empty" style="padding:16px">${['nrnd','ltb','eol'].includes(ph)?'⚠️ Phasing out with no successor mapped.':'None defined.'}</div>`}

   ${cps.length?cps.map(c=>`<div class="li" data-act="customer" data-id="${c.customer_id}"><div class="grow"><div class="pn">${esc(byId('customers',c.customer_id)?.name)}</div><div class="mut">${c.annual_volume?c.annual_volume.toLocaleString()+'/yr · ':''}${c.transition_id?'→ '+esc(pnOf(byId('transitions',c.transition_id)?.to_product_id)):'No migration set'}</div></div>${migBadge(c.transition_status)}</div>`).join(''):'<div class="card empty" style="padding:16px">No customers linked.</div>'}
   <div class="sec"><h2>History & notices</h2>${canEdit()?`<button class="btn ghost sm" data-act="new" data-arg="events" data-def="${esc(JSON.stringify({product_id:p.id,supplier_id:p.supplier_id}))}">+ Add</button>`:''}</div>
   ${evs.length?`<div class="card">${evs.map(x=>`<div class="ev" data-act="edit" data-arg="events" data-id="${x.id}"><div class="dt">${fmtMY(x.event_date)}</div><div class="grow"><b>${esc(x.title)}</b>${x.details?`<div class="mut">${esc(x.details)}</div>`:''}</div></div>`).join('')}</div>`:'<div class="card empty" style="padding:16px">No events logged.</div>'}`};
 },
 transition(e){
  const t=byId('transitions',e.id);if(!t)return null;
  const a=byId('products',t.from_product_id),b=byId('products',t.to_product_id);if(!a||!b)return null;
  const CMP=[['software_platform','Software'],['can_protocols','CAN protocols'],['interfaces','Interfaces'],['inputs','Inputs'],['outputs','Outputs'],['io_types','I/O types'],['can_ports','CAN ports'],['ethernet_ports','Ethernet ports'],['list_price','List price'],['connector','Connectors'],['ip_rating','IP rating']];
  const sk=[...new Set([...Object.keys(a.specs||{}),...Object.keys(b.specs||{})])].filter(k=>!['Notes','Generation'].includes(k)&&!HW_RAW.has(k));
  const hk=[...new Set([...hwKeys(a.category,a.hardware),...hwKeys(b.category,b.hardware)])];
  const arr=v=>Array.isArray(v)?(v.length?v.join(', '):null):v;
  const lostCan=(a.can_protocols||[]).filter(x=>!(b.can_protocols||[]).includes(x)),lostIf=(a.interfaces||[]).filter(x=>!(b.interfaces||[]).includes(x)),lostIo=(a.io_types||[]).filter(x=>!(b.io_types||[]).includes(x));
  const vals=[...CMP.map(([k,l])=>[l,arr(a[k]),arr(b[k])]),...hk.map(k=>[k,(a.hardware||{})[k],(b.hardware||{})[k]]),...sk.map(k=>[k,(a.specs||{})[k],(b.specs||{})[k]])].filter(([,x,y])=>x!=null||y!=null);
  const rows=vals.map(([l,x,y])=>{const chg=String(x??'')!==String(y??'');let dl='';if(typeof x==='number'&&typeof y==='number'&&x!==y)dl=` <b style="color:var(--warn)">(${y-x>0?'+':''}${+(y-x).toFixed(2)})</b>`;
    if(l==='I/O types'&&lostIo.length)dl=` <b style="color:var(--bad)">(drops ${esc(lostIo.join(', '))})</b>`;
    if(l==='Interfaces'&&lostIf.length)dl=` <b style="color:var(--bad)">(drops ${esc(lostIf.join(', '))})</b>`;
    if(l==='CAN protocols'&&lostCan.length)dl=` <b style="color:var(--bad)">(drops ${esc(lostCan.join(', '))})</b>`;return`<tr class="${chg?'chg':''}"><td>${l}</td><td>${esc(x??'—')}</td><td>${esc(y??'—')}${dl}</td></tr>`}).join('');
  const cps=cpsFor(t),done=cps.filter(c=>['released','complete'].includes(c.transition_status)).length;
  const imp=(lab,k,n)=>`<div class="impact"><div class="t">${lab}</div><div style="flex:1"><span class="pill" style="--c:${IMPACT[t[k]]?.c}">${IMPACT[t[k]]?.l}</span>${t[n]?`<div style="margin-top:5px;white-space:pre-wrap">${esc(t[n])}</div>`:''}</div></div>`;
  return{title:`${a.part_number} → ${b.part_number}`,right:canEdit()?`<button class="btn ghost" data-act="edit" data-arg="transitions" data-id="${t.id}">Edit</button>`:'',body:`
   <div class="ac"><div class="mini" data-act="product" data-id="${a.id}"><span class="mut" style="font-size:11px">FROM</span><div class="pn">${esc(a.part_number)}</div><div class="mut ell" style="font-size:12px">${esc(a.name)}</div><div style="margin-top:4px">${badge(phase(a))}</div>${a.eol_date?`<div class="mut" style="font-size:11.5px;margin-top:4px">EOL ${fmtMY(a.eol_date)}</div>`:''}</div><div class="arr">→</div>
   <div class="mini" data-act="product" data-id="${b.id}"><span class="mut" style="font-size:11px">TO</span><div class="pn">${esc(b.part_number)}</div><div class="mut ell" style="font-size:12px">${esc(b.name)}</div><div style="margin-top:4px">${badge(phase(b))}</div></div></div>
   <div class="row" style="margin-top:12px;flex-wrap:wrap">${ttag(t)}${basisTag(t.basis)}${t.pin_compatible?`<span class="tag">Pin-compatible: ${esc(t.pin_compatible)}</span>`:''}${t.effort_weeks?`<span class="tag">~${esc(t.effort_weeks)} wks customer effort</span>`:''}</div>
   <div class="sec"><h2>Customer impact</h2></div>
   <div class="card">${imp('Software','software_impact','software_notes')}${imp('Harness & connectors','harness_impact','harness_notes')}${imp('Mechanical','mechanical_impact','mechanical_notes')}</div>
   ${t.supplier_notice_date||t.ltb_date||t.migration_support?`<div class="card kv" style="margin-top:10px">${t.supplier_notice_date?kvItem('Supplier notice',fmt(t.supplier_notice_date),relTxt(t.supplier_notice_date)):''}${t.ltb_date?kvItem('Last-time buy',fmt(t.ltb_date),relTxt(t.ltb_date)):''}${t.migration_support?`<div style="grid-column:1/-1"><span>Migration support we offer</span><b style="white-space:pre-wrap">${esc(t.migration_support)}</b></div>`:''}</div>`:''}
   ${t.capability_gaps?`<div class="sec"><h2>Not carried over</h2></div><div class="card" style="white-space:pre-wrap;border-left:4px solid var(--warn)">${esc(t.capability_gaps)}</div>`:''}
   ${t.notes?`<div class="card" style="white-space:pre-wrap">${esc(t.notes)}</div>`:''}
   <div class="sec"><h2>Spec comparison</h2><span class="mut">changes highlighted</span></div>
   <div class="card" style="padding:6px 8px"><table class="cmp"><tr><th></th><th>${esc(a.part_number)}</th><th>${esc(b.part_number)}</th></tr>${rows}</table></div>
   <div class="sec"><h2>Customer migrations</h2><span class="mut">${done}/${cps.length} moved</span></div>
   ${cps.length?cps.map(c=>`<div class="card"><div class="row"><b class="grow" data-act="customer" data-id="${c.customer_id}" style="flex:1">${esc(byId('customers',c.customer_id)?.name)}</b>${c.target_date?`<span class="mut">target ${fmtMY(c.target_date)}</span>`:''}</div>
     ${c.notes?`<div class="mut" style="margin-top:4px">${esc(c.notes)}</div>`:''}
     <div class="mig"><select data-change="mig" data-id="${c.id}" ${canEdit()?'':'disabled'} style="border-left:4px solid ${MIGC[c.transition_status]}">${MIG.map(([k,l])=>`<option value="${k}" ${c.transition_status===k?'selected':''}>${l}</option>`).join('')}</select>${canEdit()?`<button class="btn sm" data-act="edit" data-arg="customer_products" data-id="${c.id}">Edit</button>`:''}</div></div>`).join('')
   :'<div class="card empty" style="padding:16px">No customers use the outgoing product yet.</div>'}`};
 },
 customer(e){
  const c=byId('customers',e.id);if(!c)return null;
  const cps=S.data.customer_products.filter(x=>x.customer_id===c.id);
  return{title:c.name,right:canEdit()?`<button class="btn ghost" data-act="edit" data-arg="customers" data-id="${c.id}">Edit</button>`:'',body:`
   <div class="hero"><h2>${esc(c.name)}</h2><div class="mut">${esc(c.market||'No market set')}${c.contact?' · '+esc(c.contact):''}</div></div>
   ${c.notes?`<div class="card" style="margin-top:12px;white-space:pre-wrap">${esc(c.notes)}</div>`:''}
   <div class="sec"><h2>Products & migrations</h2>${canEdit()?`<button class="btn ghost sm" data-act="new" data-arg="customer_products" data-def="${esc(JSON.stringify({customer_id:c.id}))}">+ Add</button>`:''}</div>
   ${cps.length?cps.map(x=>{const p=byId('products',x.product_id),t=byId('transitions',x.transition_id),to=t&&byId('products',t.to_product_id);if(!p)return'';
    return`<div class="card"><div class="row"><div class="grow" data-act="product" data-id="${p.id}" style="flex:1;min-width:0"><div class="pn">${esc(p.part_number)}</div><div class="mut ell">${esc(x.application||p.name)}${x.annual_volume?' · '+x.annual_volume.toLocaleString()+'/yr':''}</div></div>${badge(phase(p))}</div>
    ${to?`<div class="ac" style="margin-top:10px" data-act="transition" data-id="${t.id}"><div class="mini"><b>${esc(p.part_number)}</b></div><div class="arr">→</div><div class="mini"><b>${esc(to.part_number)}</b> <span class="mut" style="font-size:11px">${KIND[t.kind]}</span></div></div>
     <div class="chips wrap" style="margin-top:8px">${impPill('SW',t.software_impact)}${impPill('Harness',t.harness_impact)}${impPill('Mech',t.mechanical_impact)}</div>
     <div class="mig"><select data-change="mig" data-id="${x.id}" ${canEdit()?'':'disabled'} style="border-left:4px solid ${MIGC[x.transition_status]}">${MIG.map(([k,l])=>`<option value="${k}" ${x.transition_status===k?'selected':''}>${l}</option>`).join('')}</select>${x.target_date?`<span class="mut">${fmtMY(x.target_date)}</span>`:''}</div>`
    :['nrnd','ltb','eol'].includes(phase(p))?`<div class="banner" style="margin:10px 0 0">Phasing out — no migration path set.</div>`:''}
    ${canEdit()?`<div style="text-align:right"><button class="btn ghost sm" data-act="edit" data-arg="customer_products" data-id="${x.id}">Edit</button></div>`:''}</div>`}).join('')
   :'<div class="card empty" style="padding:16px">No products linked yet.</div>'}`};
 },
 form(e){
  const F=FORMS[e.table];let row;
  if(e.id){row=byId(e.table,e.id);if(!row)return null;row={...row}}else row={...(F.defaults||{}),...(e.defaults||{})};
  const fields=F.fields();
  return{title:(e.id?'Edit ':'New ')+F.title.toLowerCase(),right:canEdit()?`<button class="btn ghost" type="submit" form="frm"><b>Save</b></button>`:'',body:`
   <form id="frm">${fields.map(f=>fieldHTML(f,row)).join('')}
   ${canEdit()?`<button class="btn pri block" type="submit">Save</button>${e.id?`<button type="button" class="btn danger block" data-act="del" data-arg="${e.table}" data-id="${e.id}">Delete</button>`:''}`:''}</form>`};
 }
};

async function reload(){try{await loadAll();renderMain();renderSheet()}catch(e){toast(errMsg(e))}}
const A={
 tab:(id,arg)=>{S.tab=arg;S.stack=[];S.tlScroll=null;renderAll();window.scrollTo(0,0)},
 product:id=>push({type:'product',id}),transition:id=>push({type:'transition',id}),customer:id=>push({type:'customer',id}),
 edit:(id,arg)=>push({type:'form',table:arg,id}),
 new:(id,arg,el)=>push({type:'form',table:arg,defaults:el.dataset.def?JSON.parse(el.dataset.def):{}}),
 back:()=>{S.stack.pop();renderSheet()},closeall:()=>{S.stack=[];renderSheet()},
 async del(id,arg){if(!confirm('Delete this record? This cannot be undone.'))return;try{await remove(arg,id);S.stack.pop();toast('Deleted');renderMain();renderSheet()}catch(e){toast(errMsg(e))}},
 group:(id,arg)=>{S.f.group=arg;refreshResults()},

 cmpcat:(id,k)=>{S.cmp.cat=k;saveView();renderMain()},
 cmpsel:id=>{cmpSel();const L=S.cmp.sel[S.cmp.cat],i=L.indexOf(id);if(i>=0)L.splice(i,1);else L.push(id);refreshCompare()},

 fclrall:()=>{FGROUPS.forEach(g=>S.F[g.k]=[]);S.F.q='';const q=$('#q');if(q)q.value='';refreshResults()},

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;e.stopPropagation();A[t.dataset.act]?.(t.dataset.id,t.dataset.arg,t,e)});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.type==='checkbox'&&t.closest('label.chip'))t.closest('label.chip').classList.toggle('on',t.checked);
  if(t.name==='category'&&t.closest('#frm')){const box=$('#hwfields');if(box)box.innerHTML=hwFieldsHTML(t.value,collectHW(box));return}
  if(t.dataset.change==='incOnly'){S.incOnly=t.checked;refreshResults();return}
  if(t.dataset.change==='cmpopt'){S.cmp[t.dataset.arg]=t.checked;refreshCompare();return}
  if(t.dataset.change==='mig'){try{await save('customer_products',{id:t.dataset.id,transition_status:t.value});t.style.borderLeftColor=MIGC[t.value];toast('Status updated');renderMain()}catch(err){toast(errMsg(err))}}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.F.q=e.target.value;clearTimeout(refreshResults.t);refreshResults.t=setTimeout(refreshResults,120)}});

/* ---------- timeline quick-look card (hover on desktop, long-press on phone) ---------- */
function upcomingFor(p,n){
  const out=[];
  [['supplier_release_date','Supplier release'],['sample_date','Samples'],['onboard_date','Onboarding'],['nrnd_date','NRND'],['ltb_date','Last-time buy'],['last_ship_date','Last ship'],['eol_date','End of life'],['end_of_support_date','End of support']]
    .forEach(([k,l])=>{if(p[k]&&d(p[k])>=today)out.push({date:p[k],l,kind:'date'})});
  S.data.events.forEach(e=>{if(e.product_id===p.id&&e.event_date&&d(e.event_date)>=today)out.push({date:e.event_date,l:e.title,kind:e.kind})});
  return out.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,n);
}
function hovCard(p,ev,touch){
  const ph=phase(p),s=sup(p),out=S.data.transitions.filter(t=>t.from_product_id===p.id),inn=S.data.transitions.filter(t=>t.to_product_id===p.id);
  let h=`<h4><span>${esc(p.part_number)}</span>${badge(ph)}</h4><div class="hs"><i class="dot" style="background:${esc(s?.color||'#999')};width:7px;height:7px"></i> ${esc(s?.name||'')} · ${esc(p.sub_type||CATS1[p.category]||'')}</div>`;
  if(ev)h+=`<div class="tr" style="border-left:3px solid ${EVC[ev.kind]||'#2563eb'}"><div class="mut" style="font-size:11.5px">${esc((EVK.find(k=>k[0]===ev.kind)||[])[1]||'Event')} · ${fmt(ev.event_date)} · ${relTxt(ev.event_date)}</div><b>${esc(ev.title)}</b>${ev.details?`<div class="mut" style="margin-top:3px">${esc(ev.details)}</div>`:''}</div>`;
  if(['nrnd','ltb','eol'].includes(ph)){
    const dates=[['nrnd_date','NRND'],['ltb_date','Last-time buy'],['last_ship_date','Last ship'],['eol_date','End of life']].filter(([k])=>p[k]);
    if(dates.length)h+=`<div class="hl">Key dates</div>`+dates.map(([k,l])=>`<div class="hx"><div class="dt">${fmtMY(p[k])}</div><div>${l} <span class="mut">· ${relTxt(p[k])}</span></div></div>`).join('');
    h+=`<div class="hl">Transition${out.length>1?'s':''}</div>`;
    if(!out.length)h+=`<div class="warn">⚠ No successor mapped</div>`;
    out.forEach(t=>{const b=byId('products',t.to_product_id);if(!b)return;const cps=cpsFor(t),done=cps.filter(c=>['released','complete'].includes(c.transition_status)).length,risk=cps.filter(c=>c.transition_status==='at_risk').length;
      h+=`<div class="tr"><div>→ <b>${esc(b.part_number)}</b> ${badge(phase(b))}</div>
        <div class="chips wrap" style="margin-top:6px">${impPill('SW',t.software_impact)}${impPill('Harness',t.harness_impact)}${impPill('Mech',t.mechanical_impact)}</div>
        ${t.capability_gaps?`<div class="mut" style="margin-top:6px">${esc(t.capability_gaps.length>140?t.capability_gaps.slice(0,140)+'…':t.capability_gaps)}</div>`:''}
        <div class="mut" style="margin-top:6px">${cps.length?`${done}/${cps.length} customers moved${risk?` · <span class="warn">${risk} at risk</span>`:''}`:'No customers linked'}</div></div>`});
  }else{
    const up=upcomingFor(p,3);
    h+=`<div class="hl">Coming up</div>`+(up.length?up.map(u=>`<div class="hx"><div class="dt">${fmtMY(u.date)}</div><div>${esc(u.l)} <span class="mut">· ${relTxt(u.date)}</span></div></div>`).join(''):`<div class="mut">No upcoming dates or events.</div>`);
    if(inn.length)h+=`<div class="hl">Replaces</div><div>${inn.map(t=>esc(pnOf(t.from_product_id))).join(', ')}</div>`;
  }
  h+=touch?`<button class="btn pri block" data-act="product" data-id="${p.id}" style="margin-top:12px">Open details</button>`:`<div class="ft">Click for details</div>`;
  return h;
}
const HOV={el:null,key:null,timer:0,touch:false};
function hovShow(row,evEl,x,y,touch){
  const p=byId('products',row.dataset.id);if(!p)return;
  const ev=evEl?byId('events',evEl.dataset.id):null,key=p.id+'|'+(ev?.id||'')+'|'+touch;
  if(!HOV.el){HOV.el=document.createElement('div');document.body.appendChild(HOV.el)}
  if(HOV.key!==key){HOV.el.className='hov'+(touch?' touch':'');HOV.el.innerHTML=hovCard(p,ev,touch);HOV.key=key}
  HOV.el.style.display='block';HOV.touch=touch;hovMove(x,y);
}
function hovMove(x,y){
  const el=HOV.el;if(!el||el.style.display==='none')return;
  const w=el.offsetWidth,h=el.offsetHeight,vv=window.visualViewport,vw=vv?vv.width:document.documentElement.clientWidth,vh=vv?vv.height:innerHeight,pad=12;
  let left=HOV.touch?(vw-w)/2:x+18,top=HOV.touch?y-h-24:y+18;
  if(!HOV.touch){if(left+w>vw-pad)left=x-w-18;if(top+h>vh-pad)top=y-h-18}
  else if(top<pad)top=Math.min(y+28,vh-h-pad);
  el.style.left=Math.max(pad,Math.min(left,vw-w-pad))+'px';el.style.top=Math.max(pad,top)+'px';
}
function hovHide(){clearTimeout(HOV.timer);if(HOV.el)HOV.el.style.display='none';HOV.key=null}
// desktop: hover
document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  const row=e.target.closest&&e.target.closest('.tl-row');
  if(!row||S.stack.length){if(!HOV.touch)hovHide();return}
  const evEl=e.target.closest('.evm'),key=row.dataset.id+'|'+(evEl?.dataset.id||'')+'|false';
  if(HOV.el&&HOV.el.style.display==='block'&&HOV.key===key)return hovMove(e.clientX,e.clientY);
  clearTimeout(HOV.timer);const x=e.clientX,y=e.clientY;
  if(HOV.el&&HOV.el.style.display==='block')hovShow(row,evEl,x,y,false);   // already showing: switch instantly
  else HOV.timer=setTimeout(()=>hovShow(row,evEl,x,y,false),220);
});
document.documentElement.addEventListener('mouseleave',()=>{if(!HOV.touch)hovHide()});
document.addEventListener('scroll',()=>{if(!HOV.touch)hovHide()},true);
// phone: long-press (~0.45 s, finger held still)
(function(){
  let t=0,sx=0,sy=0,fired=0;
  document.addEventListener('touchstart',e=>{
    if(HOV.touch&&HOV.el&&!HOV.el.contains(e.target))hovHide(),HOV.touch=false;
    if(e.touches.length!==1)return clearTimeout(t);
    const row=e.target.closest&&e.target.closest('.tl-row');if(!row)return;
    const evEl=e.target.closest('.evm');sx=e.touches[0].clientX;sy=e.touches[0].clientY;
    clearTimeout(t);t=setTimeout(()=>{fired=Date.now();navigator.vibrate?.(10);hovShow(row,evEl,sx,sy,true)},450);
  },{passive:true});
  document.addEventListener('touchmove',e=>{if(Math.hypot(e.touches[0].clientX-sx,e.touches[0].clientY-sy)>10)clearTimeout(t)},{passive:true});
  document.addEventListener('touchend',()=>clearTimeout(t));
  document.addEventListener('touchcancel',()=>clearTimeout(t));
  // the finger lifting after a long-press must not also "tap" the row
  document.addEventListener('click',e=>{if(Date.now()-fired<700&&e.target.closest('.tl')){e.stopPropagation();e.preventDefault()}},true);
  document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.tl'))e.preventDefault()});
})();

/* ---------- zoom gestures ---------- */
const inTl=t=>t&&t.closest&&t.closest('.tl');
// iPhone / Android: two-finger pinch on the timeline
(function(){
  let pz=null,raf=0,pending=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const mid=t=>(t[0].clientX+t[1].clientX)/2;
  function move(e){if(!pz||e.touches.length<2)return;e.preventDefault();
    pending=[pz.mw*dist(e.touches)/pz.d,mid(e.touches)];
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(pending)setZoom(pending[0],pending[1])})}
  function end(e){if(pz&&e.touches.length<2){pz.els.forEach(el=>{el.removeEventListener('touchmove',move);el.removeEventListener('touchend',end);el.removeEventListener('touchcancel',end)});pz=null;saveView()}}
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==2||!inTl(e.touches[0].target))return;
    e.preventDefault();
    // listen on the touched elements too: they get re-rendered (detached) while zooming
    const els=[...new Set([e.touches[0].target,e.touches[1].target,document])];
    pz={d:dist(e.touches),mw:S.mw,els};
    els.forEach(el=>{el.addEventListener('touchmove',move,{passive:false});el.addEventListener('touchend',end);el.addEventListener('touchcancel',end)});
  },{passive:false});
  // stop iOS Safari zooming the whole page when pinching the timeline
  ['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>{if(pz||inTl(e.target))e.preventDefault()},{passive:false}));
})();
// Desktop: Ctrl/⌘ + wheel, and trackpad pinch (sent as ctrl+wheel by Chrome/Edge/Firefox)
document.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey)||!inTl(e.target))return;e.preventDefault();setZoom(S.mw*Math.exp(-Math.max(-50,Math.min(50,e.deltaY))*0.006),e.clientX)},{passive:false});
// Safari on Mac: trackpad pinch arrives as gesture events
if(!('ontouchstart' in window)){let g0=null;
  document.addEventListener('gesturestart',e=>{if(inTl(e.target)){e.preventDefault();g0=S.mw}},{passive:false});
  document.addEventListener('gesturechange',e=>{if(g0!=null){e.preventDefault();setZoom(g0*e.scale,e.clientX)}},{passive:false});
  document.addEventListener('gestureend',()=>{g0=null});}
// re-layout when the window crosses the phone/desktop breakpoint or rotates
let _wasWide=wide()+'|'+(innerWidth>=1100);
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{const k=wide()+'|'+(innerWidth>=1100);if(k!==_wasWide&&$('nav.tabs')){_wasWide=k;saveTl();renderAll()}},150)});
document.addEventListener('submit',async e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='conn'){const fd=new FormData(f);localStorage.setItem('rm_cfg',JSON.stringify({url:fd.get('url').trim().replace(/\/$/,''),key:fd.get('key').trim()}));location.reload();return}
  if(f.id==='pw'){
    const fd=new FormData(f),p1=fd.get('p1'),p2=fd.get('p2'),err=$('#pwerr'),btn=f.querySelector('button');
    if(p1!==p2){err.textContent='The two passwords don\'t match.';return}
    btn.disabled=true;btn.textContent='Saving…';err.textContent='';
    const{data,error}=await S.sb.auth.updateUser({password:p1,data:{pw_set:true}});
    btn.disabled=false;btn.textContent='Change password';
    if(error){
      let m=error.message||String(error);
      if(/reauth/i.test(m))m='Supabase is set to require email re-confirmation for password changes. Ask your admin to turn off "Secure password change" in Supabase (Authentication → Email).';
      else if(/different from the old/i.test(m))m='Choose a password different from your current one.';
      err.textContent=m;return}
    if(data?.user)S.user=data.user;
    f.reset();toast('Password changed');renderMain();return}
  if(f.id==='login'){const fd=new FormData(f),btn=f.querySelector('button');btn.disabled=true;btn.textContent='Signing in…';
    const{data,error}=await S.sb.auth.signInWithPassword({email:fd.get('email').trim(),password:fd.get('password')});
    if(error){btn.disabled=false;btn.textContent='Sign in';$('#lerr').textContent=error.message;return}
    S.user=data.user;return afterLogin()}
  if(f.id==='frm'){
    const top=S.stack[S.stack.length-1],F=FORMS[top.table],o=collect(f,F.fields());
    if(top.table==='transitions'&&o.from_product_id===o.to_product_id)return toast('From and To must be different products.');
    if(top.id)o.id=top.id;
    const oldMarket=top.table==='markets'&&top.id?byId('markets',top.id)?.name:null;
    try{await save(top.table,o);
      if(oldMarket&&o.name&&oldMarket!==o.name)await renameMarket(oldMarket,o.name);
      toast('Saved');S.stack.pop();renderMain();renderSheet()}catch(err){toast(errMsg(err))}
  }
});

/* renaming a market also relabels the products and customers tagged with it */
async function renameMarket(from,to){
  for(const p of S.data.products.filter(p=>(p.markets||[]).includes(from)))
    await save('products',{id:p.id,markets:[...new Set(p.markets.map(m=>m===from?to:m))]});
  for(const c of S.data.customers.filter(c=>c.market===from))
    await save('customers',{id:c.id,market:to});
}

/* ---------- boot ---------- */
function renderLogin(){
  $('#app').innerHTML=`<div class="center"><div class="card"><h2 style="margin:0 0 4px">Portfolio Roadmap</h2><p class="mut" style="margin-top:0">Sign in with your team account.</p>
  <form id="login"><div class="field"><label class="l">Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label class="l">Password</label><input name="password" type="password" autocomplete="current-password" required></div>
  <div id="lerr" style="color:var(--bad);font-size:13px"></div><button class="btn pri block">Sign in</button></form>
  <p class="mut" style="font-size:12.5px;margin:12px 0 0">Forgot your password? Ask your roadmap admin to reset it. Once signed in, you can change it under More → Your account.</p>
  ${cfg().hard?'':'<button class="btn ghost" style="margin-top:8px" data-act="disconnect">Use a different project</button>'}</div></div>`;
}
function renderMsg(title,msg){$('#app').innerHTML=`<div class="center"><div class="card"><h2 style="margin:0 0 6px">${esc(title)}</h2><p class="mut">${esc(msg)}</p><div class="btns"><button class="btn" onclick="location.reload()">Retry</button>${S.sb?'<button class="btn" data-act="signout">Sign out</button>':''}${cfg().hard?'':'<button class="btn danger" data-act="disconnect">Disconnect</button>'}</div></div></div>`}
async function afterLogin(){
  try{
    const{data:m,error}=await S.sb.from('members').select('role').maybeSingle();
    if(error)throw error;
    if(!m)return renderMsg('No access yet',`${S.user.email} isn't on the roadmap team list. Ask an admin to add you to roadmap.members.`);
    S.role=m.role;await loadAll();renderAll();
  }catch(e){renderMsg('Could not load data',errMsg(e))}
}
async function init(){
  const c=cfg();
  if(c.url&&c.key&&window.supabase){
    S.mode='live';S.sb=supabase.createClient(c.url,c.key,{db:{schema:CONFIG.SCHEMA}});
    const{data:{session}}=await S.sb.auth.getSession();
    if(!session)return renderLogin();
    S.user=session.user;return afterLogin();
  }
  S.mode='demo';S.role='admin';await loadAll();renderAll();
}
init();
</script>
